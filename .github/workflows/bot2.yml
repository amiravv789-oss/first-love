name: Main Bot (Private Code Runner)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/330 * * * *'

concurrency:
  group: bot-runner
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Runner Repo (For history.json)
        uses: actions/checkout@v4

      - name: Clone private repository
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/archivebot.git bot-code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rar

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          if [ -f bot-code/requirements.txt ]; then pip install -r bot-code/requirements.txt; fi

      - name: Copy existing history.json to bot directory
        run: |
          if [ -f history.json ]; then
            cp history.json bot-code/history.json
            echo "Loaded existing history.json from runner repo."
          else
            echo "No history.json found in runner repo, starting fresh."
          fi

      - name: Run Main
        run: |
          cd bot-code
          timeout 320m python main.py || true

      - name: Extract and commit updated history back to runner repo
        run: |
          if [ -f bot-code/history.json ]; then
            cp bot-code/history.json ./history.json
            git config --global user.name "GitHub Actions Bot"
            git config --global user.email "actions@github.com"
            git add history.json
            git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update bot history.json [skip ci]"
            git push
          else
            echo "history.json not generated by bot."
          fi

      - name: Trigger Next Workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot2.yml',
              ref: context.ref
            })
