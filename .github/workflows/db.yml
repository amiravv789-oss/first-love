#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
Atlas Local Search - single-file launcher
- Downloads and merges the SQLite database from the configured GitHub release.
- Downloads the single ZIP containing the existing Tantivy index and extracts it.
- Serves a local Flask search UI.
- SQLite is opened read-only by the web application.
"""

from __future__ import annotations

import os
import re
import sys
import json
import time
import shutil
import zipfile
import sqlite3
import urllib.request
import urllib.parse
import urllib.error
from pathlib import Path
from collections import defaultdict

# ------------------------------ CONFIG ---------------------------------

GITHUB_REPO = "amiravv789-oss/first-mistake"
DB_RELEASE_TAG = os.environ.get("DB_RELEASE_TAG", "csv-backup-20261117-223035")

INDEX_ZIP_URL = (
    "https://github.com/amiravv789-oss/first-mistake/"
    "releases/download/20261118-213228/file_0.part000000"
)

BASE = Path(__file__).resolve().parent
DOWNLOAD_DIR = BASE / "github_db_download"
DB_PATH = Path(os.environ.get("CUSTOMERS_DB", str(BASE / "users_merged.db"))).expanduser().resolve()
INDEX_DIR = Path(os.environ.get("USERS_SEARCH_INDEX", str(BASE / "users_search_index"))).expanduser().resolve()
INDEX_ZIP = DOWNLOAD_DIR / "tantivy_index.zip"
INDEX_EXTRACT = DOWNLOAD_DIR / "tantivy_index_extracted"

HOST = os.environ.get("LOCAL_SEARCH_HOST", "127.0.0.1")
PORT = int(os.environ.get("LOCAL_SEARCH_PORT", "8080"))

PAGE_SIZE_DEFAULT = 25
PAGE_SIZE_MAX = 100
MAX_SEARCH_HITS = 100_000
DOWNLOAD_CHUNK = 8 * 1024 * 1024
DB_BATCH = 5000

DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)

# ------------------------------ UTILITIES -------------------------------

def log(message: str) -> None:
    print(f"[Atlas] {message}", flush=True)


def request_headers(accept: str = "application/vnd.github+json") -> dict:
    headers = {
        "User-Agent": "Atlas-Local-Searcher/1.0",
        "Accept": accept,
        "X-GitHub-Api-Version": "2022-11-28",
    }
    token = os.environ.get("GH_TOKEN")
    if token:
        headers["Authorization"] = f"Bearer {token}"
    return headers


def download_url(url: str, destination: Path, expected_size: int | None = None,
                 headers: dict | None = None, timeout: int = 300) -> None:
    destination.parent.mkdir(parents=True, exist_ok=True)
    if destination.exists() and destination.stat().st_size > 0:
        if expected_size is None or destination.stat().st_size == expected_size:
            log(f"Already downloaded: {destination.name}")
            return

    temp = destination.with_name(destination.name + ".download")
    req = urllib.request.Request(url, headers=headers or {"User-Agent": "Atlas-Local-Searcher/1.0"})
    try:
        log(f"Downloading: {destination.name}")
        with urllib.request.urlopen(req, timeout=timeout) as response, open(temp, "wb") as out:
            shutil.copyfileobj(response, out, DOWNLOAD_CHUNK)
        size = temp.stat().st_size
        if size <= 0:
            raise RuntimeError(f"Downloaded file is empty: {destination.name}")
        if expected_size is not None and size != expected_size:
            raise RuntimeError(
                f"Size mismatch for {destination.name}: expected {expected_size:,}, got {size:,}"
            )
        os.replace(temp, destination)
        log(f"Downloaded {destination.name}: {size:,} bytes")
    finally:
        if temp.exists():
            temp.unlink()


def sqlite_integrity(path: Path) -> None:
    uri = path.resolve().as_uri() + "?mode=ro"
    conn = sqlite3.connect(uri, uri=True, timeout=120)
    try:
        result = conn.execute("PRAGMA integrity_check").fetchone()[0]
        if result != "ok":
            raise RuntimeError(f"SQLite integrity check failed for {path.name}: {result}")
    finally:
        conn.close()


# -------------------------- DATABASE DOWNLOAD ---------------------------

def download_database_release() -> list[Path]:
    api_url = (
        f"https://api.github.com/repos/{GITHUB_REPO}/releases/tags/"
        f"{urllib.parse.quote(DB_RELEASE_TAG, safe='')}"
    )
    req = urllib.request.Request(api_url, headers=request_headers())
    log(f"Reading database release: {DB_RELEASE_TAG}")
    with urllib.request.urlopen(req, timeout=60) as response:
        release = json.loads(response.read().decode("utf-8"))

    assets = release.get("assets", [])
    db_assets = [
        a for a in assets
        if re.search(r"\.db(?:\.part[_-]?\d+)?$", a.get("name", ""), re.I)
    ]
    if not db_assets:
        raise RuntimeError(
            f"No .db assets found in GitHub release {DB_RELEASE_TAG!r}. "
            "Check DB_RELEASE_TAG and GH_TOKEN."
        )

    downloaded = []
    for i, asset in enumerate(db_assets, 1):
        name = Path(asset["name"]).name
        destination = DOWNLOAD_DIR / name
        log(f"Database asset {i}/{len(db_assets)}: {name}")
        expected_size = int(asset.get("size", 0)) or None
        # Prefer the GitHub API asset endpoint. Some release configurations return
        # 404 from browser_download_url even though the release API lists the asset.
        # Fall back to browser_download_url if the API endpoint is unavailable.
        asset_api_url = asset.get("url")
        browser_url = asset.get("browser_download_url")
        attempts = []
        if asset_api_url:
            attempts.append((asset_api_url, "GitHub asset API"))
        if browser_url:
            attempts.append((browser_url, "browser download URL"))
        last_error = None
        for asset_url, label in attempts:
            try:
                log(f"  Trying {label}")
                download_url(
                    asset_url,
                    destination,
                    expected_size=expected_size,
                    headers=request_headers("application/octet-stream"),
                    timeout=900,
                )
                last_error = None
                break
            except urllib.error.HTTPError as exc:
                last_error = exc
                log(f"  {label} returned HTTP {exc.code}")
                if exc.code not in (401, 403, 404, 410):
                    raise
        if last_error is not None:
            raise RuntimeError(
                f"Could not download GitHub release asset {name!r}. "
                f"Both available download endpoints failed; last HTTP status: "
                f"{last_error.code}. Check release visibility, GH_TOKEN, and asset URL."
            ) from last_error
        downloaded.append(destination)
    return downloaded


def reconstruct_database_parts(files: list[Path]) -> list[Path]:
    groups: dict[str, list[tuple[int, Path]]] = defaultdict(list)
    standalone: list[Path] = []

    for file in files:
        match = re.match(r"^(.+\.db)\.part[_-]?(\d+)$", file.name, re.I)
        if match:
            groups[match.group(1)].append((int(match.group(2)), file))
        elif file.name.lower().endswith(".db"):
            standalone.append(file)

    reconstructed = []
    for original, parts in groups.items():
        parts.sort(key=lambda item: item[0])
        numbers = [number for number, _ in parts]
        # Accept either 0-based or 1-based part numbering, but require no gaps.
        expected = list(range(numbers[0], numbers[0] + len(numbers)))
        if numbers != expected or numbers[0] not in (0, 1):
            raise RuntimeError(f"Missing or duplicate database parts for {original}: {numbers[:20]}")

        output = DOWNLOAD_DIR / original
        temp = output.with_suffix(output.suffix + ".tmp")
        log(f"Reassembling database: {original}")
        with open(temp, "wb") as target:
            for number, part in parts:
                log(f"  Appending part {number}: {part.name}")
                with open(part, "rb") as source:
                    shutil.copyfileobj(source, target, DOWNLOAD_CHUNK)
            target.flush()
            os.fsync(target.fileno())
        os.replace(temp, output)
        sqlite_integrity(output)
        reconstructed.append(output)
        log(f"Reassembled and verified: {output.name}")

    # Do not include a reconstructed file twice.
    seen = {p.resolve() for p in reconstructed}
    for path in standalone:
        if path.resolve() not in seen:
            reconstructed.append(path)
    return reconstructed


def quote_ident(name: str) -> str:
    return '"' + str(name).replace('"', '""') + '"'


def merge_database_files(sources: list[Path]) -> None:
    if not sources:
        raise RuntimeError("No SQLite database files were downloaded.")

    if len(sources) == 1:
        source = sources[0]
        if source.resolve() != DB_PATH.resolve():
            DB_PATH.parent.mkdir(parents=True, exist_ok=True)
            temp = DB_PATH.with_name(DB_PATH.name + ".new")
            shutil.copy2(source, temp)
            sqlite_integrity(temp)
            if DB_PATH.exists():
                backup = DB_PATH.with_name(DB_PATH.stem + ".backup" + DB_PATH.suffix)
                if not backup.exists():
                    shutil.copy2(DB_PATH, backup)
                log(f"Existing database backup: {backup}")
            os.replace(temp, DB_PATH)
        sqlite_integrity(DB_PATH)
        log(f"Database ready: {DB_PATH}")
        return

    DB_PATH.parent.mkdir(parents=True, exist_ok=True)
    temp_target = DB_PATH.with_name(DB_PATH.stem + ".building" + DB_PATH.suffix)
    if temp_target.exists():
        temp_target.unlink()

    target = sqlite3.connect(str(temp_target), timeout=120)
    try:
        target.execute("PRAGMA journal_mode=DELETE")
        target.execute("PRAGMA synchronous=NORMAL")
        target.execute("PRAGMA temp_store=FILE")
        target.execute("PRAGMA busy_timeout=120000")

        for source_path in sources:
            log(f"Merging database: {source_path.name}")
            source_uri = source_path.resolve().as_uri() + "?mode=ro"
            source = sqlite3.connect(source_uri, uri=True, timeout=120)
            try:
                integrity = source.execute("PRAGMA integrity_check").fetchone()[0]
                if integrity != "ok":
                    raise RuntimeError(f"Corrupt source database: {source_path.name}")

                tables = source.execute("""
                    SELECT name, sql FROM sqlite_master
                    WHERE type='table' AND name NOT LIKE 'sqlite_%'
                    ORDER BY name
                """).fetchall()

                for table, create_sql in tables:
                    if not create_sql:
                        continue
                    qtable = quote_ident(table)
                    exists = target.execute(
                        "SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",
                        (table,),
                    ).fetchone()

                    if not exists:
                        target.execute(create_sql)

                    src_info = source.execute(f"PRAGMA table_info({qtable})").fetchall()
                    dst_info = target.execute(f"PRAGMA table_info({qtable})").fetchall()
                    dst_names = {r[1] for r in dst_info}

                    # Add compatible missing columns. Primary-key/constraint evolution
                    # is intentionally not guessed.
                    for col in src_info:
                        if col[1] not in dst_names:
                            if int(col[5]) > 0:
                                raise RuntimeError(
                                    f"Cannot safely merge changed primary-key schema in table {table!r}"
                                )
                            col_type = col[2] or "BLOB"
                            target.execute(
                                f"ALTER TABLE {qtable} ADD COLUMN {quote_ident(col[1])} {col_type}"
                            )
                            dst_names.add(col[1])

                    common = [r[1] for r in src_info if r[1] in dst_names]
                    if not common:
                        continue
                    col_sql = ", ".join(quote_ident(c) for c in common)
                    marks = ", ".join("?" for _ in common)
                    cursor = source.execute(f"SELECT {col_sql} FROM {qtable}")
                    insert = f"INSERT OR IGNORE INTO {qtable} ({col_sql}) VALUES ({marks})"
                    inserted = 0

                    while True:
                        batch = cursor.fetchmany(DB_BATCH)
                        if not batch:
                            break
                        before = target.total_changes
                        target.executemany(insert, batch)
                        inserted += target.total_changes - before

                    log(f"  {table}: {inserted:,} rows inserted")
                target.commit()
            finally:
                source.close()

        check = target.execute("PRAGMA integrity_check").fetchone()[0]
        if check != "ok":
            raise RuntimeError(f"Merged database integrity check failed: {check}")
        target.commit()
    except Exception:
        target.rollback()
        raise
    finally:
        target.close()

    if DB_PATH.exists():
        backup = DB_PATH.with_name(DB_PATH.stem + ".backup" + DB_PATH.suffix)
        if not backup.exists():
            shutil.copy2(DB_PATH, backup)
        log(f"Existing database backup: {backup}")
    os.replace(temp_target, DB_PATH)
    sqlite_integrity(DB_PATH)
    log(f"Merged database ready: {DB_PATH}")


# ---------------------------- INDEX DOWNLOAD ----------------------------

def safe_extract_zip(zip_path: Path, destination: Path) -> None:
    if not zipfile.is_zipfile(zip_path):
        raise RuntimeError(
            "The downloaded index asset is not a valid ZIP file. "
            "The URL may point to a GitHub error page or a different asset."
        )

    if destination.exists():
        shutil.rmtree(destination)
    destination.mkdir(parents=True, exist_ok=True)
    root = destination.resolve()

    with zipfile.ZipFile(zip_path) as archive:
        bad = archive.testzip()
        if bad:
            raise RuntimeError(f"ZIP CRC validation failed at: {bad}")
        for member in archive.infolist():
            target = (destination / member.filename).resolve()
            if target != root and root not in target.parents:
                raise RuntimeError("Unsafe path inside index ZIP.")
        archive.extractall(destination)

    # Find the Tantivy index root by its meta.json marker.
    meta_files = list(destination.rglob("meta.json"))
    if not meta_files:
        raise RuntimeError(
            "ZIP extracted, but no Tantivy meta.json was found. "
            "The archive does not appear to contain the Tantivy index."
        )

    # Tantivy's meta.json is directly inside the index directory.
    candidates = []
    for meta in meta_files:
        parent = meta.parent
        try:
            data = json.loads(meta.read_text("utf-8"))
            if "segments" in data:
                candidates.append(parent)
        except Exception:
            continue
    if not candidates:
        raise RuntimeError("No valid Tantivy index metadata found in the ZIP.")

    if len(candidates) > 1:
        # Choose the shallowest valid index root; fail if ambiguous at same depth.
        candidates.sort(key=lambda p: len(p.parts))
        if len(candidates) > 1 and len(candidates[0].parts) == len(candidates[1].parts):
            raise RuntimeError("ZIP contains multiple Tantivy indexes; refusing to guess.")
    source_index = candidates[0]

    if INDEX_DIR.exists():
        backup = INDEX_DIR.with_name(INDEX_DIR.name + ".previous")
        if backup.exists():
            shutil.rmtree(backup)
        os.replace(INDEX_DIR, backup)
        log(f"Previous index kept at: {backup}")

    INDEX_DIR.parent.mkdir(parents=True, exist_ok=True)
    if source_index == destination:
        staging = INDEX_DIR.with_name(INDEX_DIR.name + ".building")
        if staging.exists():
            shutil.rmtree(staging)
        shutil.copytree(source_index, staging)
    else:
        staging = INDEX_DIR.with_name(INDEX_DIR.name + ".building")
        if staging.exists():
            shutil.rmtree(staging)
        shutil.copytree(source_index, staging)

    # Validate metadata before making it active.
    try:
        import tantivy
        test_index = tantivy.Index.open(str(staging))
        test_index.reload()
        count = int(test_index.searcher().num_docs)
        if count <= 0:
            raise RuntimeError("Tantivy index contains zero documents.")
    except Exception:
        if staging.exists():
            shutil.rmtree(staging)
        raise

    if INDEX_DIR.exists():
        shutil.rmtree(INDEX_DIR)
    os.replace(staging, INDEX_DIR)
    log(f"Tantivy index installed: {INDEX_DIR} ({count:,} documents)")


def download_and_install_index() -> None:
    # A valid existing index is reused. Set FORCE_INDEX_DOWNLOAD=1 to refresh it.
    force = os.environ.get("FORCE_INDEX_DOWNLOAD", "0") == "1"
    if INDEX_DIR.is_dir() and not force:
        try:
            import tantivy
            existing = tantivy.Index.open(str(INDEX_DIR))
            existing.reload()
            count = int(existing.searcher().num_docs)
            if count > 0:
                log(f"Existing Tantivy index reused: {count:,} documents")
                return
        except Exception as exc:
            log(f"Existing index is not usable; downloading replacement: {exc}")

    download_url(INDEX_ZIP_URL, INDEX_ZIP, headers={"User-Agent": "Atlas-Local-Searcher/1.0"}, timeout=1800)
    safe_extract_zip(INDEX_ZIP, INDEX_EXTRACT)


def initialize_assets() -> None:
    # Resolve/download the release assets on every startup. Existing correctly-sized
    # downloads are reused; the expensive DB merge is only needed when the DB is absent
    # or FORCE_DB_REBUILD=1 is explicitly requested.
    downloaded = download_database_release()
    if not DB_PATH.is_file() or os.environ.get("FORCE_DB_REBUILD", "0") == "1":
        sources = reconstruct_database_parts(downloaded)
        merge_database_files(sources)
    else:
        log(f"Existing database reused after release asset check: {DB_PATH}")
        sqlite_integrity(DB_PATH)

    download_and_install_index()


