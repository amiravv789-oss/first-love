.shell{max-width:1440px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#8b7cff,#36d6c3);display:grid;place-items:center;color:#08101d;font-size:25px;font-weight:900}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:4px}.pill{border:1px solid #27534f;background:#12312f;color:#a5f5e9;border-radius:30px;padding:9px 14px;font-size:12px}
.hero{padding:28px 0 24px}.eyebrow{color:#9d91ff;font-size:13px}.hero h1{font-size:clamp(28px,4vw,46px);line-height:1.45;margin:12px 0}.hero h1 span{color:#a79bff}.hero p{color:var(--muted);margin:0 0 23px}
.searchbox{display:flex;gap:10px;padding:9px;background:#111b2e;border:1px solid #344563;border-radius:19px;box-shadow:0 18px 55px #0005}.searchbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:17px;padding:13px}.btn{border:0;border-radius:13px;padding:13px 22px;background:linear-gradient(135deg,#9184ff,#6a5de0);color:white;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}
.options{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:14px 4px}.options label{display:flex;gap:8px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.metric,.card{background:linear-gradient(145deg,#121d31,#0f1828);border:1px solid var(--line);border-radius:19px}.metric{padding:18px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:22px;margin-top:9px}
.card{padding:20px;margin:18px 0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.card h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}.field input{width:100%;background:#0b1424;border:1px solid #2a3a55;border-radius:11px;color:var(--text);padding:12px;outline:none}.field input:focus,.searchbox:focus-within{border-color:#887cff;box-shadow:0 0 0 3px #887cff22}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:right;padding:14px 13px;border-bottom:1px solid #23314a;font-size:13px}th{color:#b9c7df;background:#17243a;position:sticky;top:0}td{color:#e5edfc}tbody tr:hover{background:#192640}.detail{border:1px solid #6e63d5;background:#28234b;color:#dcd7ff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:bold}.detail:hover{background:#39316c;transform:translateY(-1px)}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:17px;color:var(--muted)}.pagination button{background:#1c2a43;color:white;border:1px solid #344665;border-radius:10px;padding:9px 15px;cursor:pointer;margin-right:6px}.pagination button:disabled{opacity:.35}
.modal{display:none;position:fixed;inset:0;background:#020611d9;z-index:9;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(900px,100%);max-height:88vh;overflow:auto;background:#111b2d;border:1px solid #3a4b6b;border-radius:22px;padding:24px;scrollbar-width:none}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#273650;color:white;border:0;border-radius:10px;padding:8px 13px;cursor:pointer}.detailsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.detailitem{background:#0b1424;border:1px solid #263650;border-radius:12px;padding:13px;overflow-wrap:anywhere}.detailitem small{display:block;color:var(--muted);margin-bottom:7px}.detailitem b{font-size:14px;white-space:pre-wrap}
.notice{padding:12px 15px;border-radius:12px;background:#35252b;color:#ffc6c6;margin:10px 0;display:none}.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:1fr}.shell{padding:16px}}@media(max-width:520px){.filters{grid-template-columns:1fr}.searchbox{flex-wrap:wrap}.searchbox input{flex-basis:100%}.searchbox .btn{width:100%}.detailsgrid{grid-template-columns:1fr}.top{margin-bottom:16px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="logo">A</div><div><b>اطلس</b><small>سامانه جستجوی محلی</small></div></div><span class="pill">● محلی · فقط خواندنی</span></header>
<section class="hero"><div class="eyebrow">فضای جستجوی خصوصی</div><h1>اطلاعات را پیدا کن،<br><span>نه اینکه دنبالش بگردی.</span></h1><p>جستجو در همه فیلدها با فیلترهای مستقل و دقیق.</p>
<div class="searchbox"><input id="q" placeholder="نام، کد ملی، آدرس یا هر عبارت..." autocomplete="off"><button class="btn" id="go">جستجو ←</button></div>
<div class="options"><label><input type="checkbox" id="fuzzy"> جستجوی فازی (تحمل غلط تایپی)</label><span id="mode">جستجوی دقیق</span><button id="clear" style="background:none;border:0;color:#aaa;cursor:pointer">پاک کردن عبارت</button></div></section>
<section class="metrics"><div class="metric"><small>تعداد اسناد ایندکس</small><strong id="docCount">—</strong></div><div class="metric"><small>نتایج</small><strong id="resultCount">—</strong></div><div class="metric"><small>وضعیت</small><strong id="status">در حال بررسی</strong></div></section>
<section class="card"><div class="cardhead"><div><h2>فیلترهای تکمیلی</h2><div class="muted">هر فیلتر فقط روی ستون متناظر خودش اعمال می‌شود؛ همه فیلترها با AND ترکیب می‌شوند.</div></div><button class="detail" id="reset">پاک کردن فیلترها</button></div><div class="filters" id="filters"></div></section>
<section class="card"><div class="cardhead"><div><h2>نتایج جستجو</h2><div class="muted" id="caption">عبارت یا فیلتر را وارد کن.</div></div><label class="muted">تعداد در صفحه <select id="size"><option>25</option><option>50</option><option>100</option></select></label></div>
<div class="notice" id="error"></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"><tr><td class="empty">در انتظار جستجو</td></tr></tbody></table></div>
<div class="pagination"><span id="pageinfo">صفحه ۱</span><div><button id="prev" disabled>قبلی</button><button id="next" disabled>بعدی</button></div></div></section>
</div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">نمای کامل رکورد</div><h2>جزئیات اطلاعات</h2></div><button class="close" id="close">بستن ×</button></div><div class="detailsgrid" id="detailgrid"></div></div></div>
<script>
const $=id=>document.getElementById(id);let meta=null,page=1,pages=1,columns=[],labels={},filters={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buildFilters(){const root=$('filters');root.innerHTML='';meta.columns.filter(c=>c!==meta.primary_key).forEach(c=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${esc(meta.labels[c]||c)}</label><input data-col="${esc(c)}" placeholder="فیلتر ${esc(meta.labels[c]||c)}">`;root.appendChild(d);});root.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{filters[i.dataset.col]=i.value;clearTimeout(window.ft);window.ft=setTimeout(()=>run(1),450);}));}
function params(){const p=new URLSearchParams({q:$('q').value.trim(),fuzzy:$('fuzzy').checked?'1':'0',page:String(page),per_page:$('size').value});Object.entries(filters).forEach(([k,v])=>{if(v.trim())p.set('filter_'+k,v.trim());});return p;}
async function run(p=1){page=p;$('error').style.display='none';$('go').disabled=true;$('caption').textContent='در حال جستجو...';try{const r=await fetch('/api/search?'+params());const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Search failed');pages=d.pages||1;$('resultCount').textContent=Number(d.total).toLocaleString('fa-IR');$('caption').textContent=`${Number(d.total).toLocaleString('fa-IR')} نتیجه · صفحه ${page} از ${pages}`;render(d);}catch(e){$('error').textContent=e.message;$('error').style.display='block';$('tbody').innerHTML='<tr><td class="empty">جستجو ناموفق بود</td></tr>';}finally{$('go').disabled=false;}}
function render(d){const visible=columns.filter(c=>c!==meta.primary_key);$('thead').innerHTML='<tr>'+['کد ملی','نام و نام خانوادگی','نام پدر','تاریخ تولد','جزئیات'].map(x=>`<th>${x}</th>`).join('')+'</tr>';const role={national:findRole('national'),name:findRole('name'),father:findRole('father'),birth:findRole('birth')};$('tbody').innerHTML='';if(!d.rows.length){$('tbody').innerHTML='<tr><td class="empty" colspan="5">نتیجه‌ای پیدا نشد</td></tr>';}d.rows.forEach(row=>{const tr=document.createElement('tr');const values=[role.national,role.name,role.father,role.birth].map(c=>c?row[c]??'—':'—');tr.innerHTML=values.map(v=>`<td>${esc(v)}</td>`).join('')+`<td><button class="detail" data-id="${esc(row[meta.primary_key])}">مشاهده جزئیات ↗</button></td>`;$('tbody').appendChild(tr);});$('tbody').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id));$('pageinfo').textContent=`صفحه ${page.toLocaleString('fa-IR')} از ${pages.toLocaleString('fa-IR')}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;}
function findRole(role){const aliases={national:['nationalcode','nationalid','nationalnumber','codemelli','melli','کدملی'],name:['fullname','full_name','name','نام','نامونامخانوادگی'],father:['fathername','father','نامپدر'],birth:['birthdate','dateofbirth','تاریختولد']};for(const c of columns){const n=c.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');if(aliases[role].includes(n))return c;}const fallback={national:1,name:2,father:3,birth:4};return columns[fallback[role]]||null;}
async function detail(id){try{const r=await fetch('/api/row/'+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Detail failed');$('detailgrid').innerHTML=d.columns.map(c=>`<div class="detailitem"><small>${esc(d.labels[c]||c)}</small><b>${esc(d.row[c]??'—')}</b></div>`).join('');$('modal').classList.add('show');}catch(e){$('error').textContent=e.message;$('error').style.display='block';}}
$('go').onclick=()=>run(1);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')run(1)});$('fuzzy').onchange=()=>{$('mode').textContent=$('fuzzy').checked?'جستجوی فازی':'جستجوی دقیق';run(1)};$('clear').onclick=()=>{$('q').value='';run(1)};$('reset').onclick=()=>{filters={};$('filters').querySelectorAll('input').forEach(i=>i.value='');run(1)};$('size').onchange=()=>run(1);$('prev').onclick=()=>run(page-1);$('next').onclick=()=>run(page+1);$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
async function init(){try{const r=await fetch('/api/health');meta=await r.json();if(!r.ok||!meta.ok)throw Error(meta.error||'Health check failed');columns=meta.columns;labels=meta.labels;$('docCount').textContent=Number(meta.index_count).toLocaleString('fa-IR');$('status').textContent='متصل';buildFilters();run(1);}catch(e){$('status').textContent='خطا';$('error').textContent=e.message;$('error').style.display='block';}}init();
</script></body></html>"""


# ------------------------------- STARTUP ---------------------------------

initialize_assets()

with readonly_connection() as _conn:
    TABLE_NAME, TABLE_INFO, DB_COLUMNS, PRIMARY_KEY = detect_table(_conn)
INDEX_FIELD_MAP = get_index_field_map(DB_COLUMNS)

if not INDEX_DIR.is_dir():
    raise RuntimeError(f"Tantivy index directory missing: {INDEX_DIR}")
SEARCH_INDEX = tantivy.Index.open(str(INDEX_DIR))
SEARCH_INDEX.reload()
INDEX_DOC_COUNT = int(SEARCH_INDEX.searcher().num_docs)
if INDEX_DOC_COUNT != 74_931_639:
    log(
        f"Notice: index has {INDEX_DOC_COUNT:,} documents; "
        "the known source snapshot had 74,931,639 rows. Continuing after index validation."
    )

@app.get("/")
def home():
    return HTML

@app.get("/api/health")
def health():
    return jsonify(
        ok=True, database=DB_PATH.name, table=TABLE_NAME,
        columns=DB_COLUMNS, primary_key=PRIMARY_KEY,
        labels=get_labels(DB_COLUMNS), index_count=INDEX_DOC_COUNT,
    )

@app.get("/api/search")
def search():
    query_text = (request.args.get("q") or "").strip()
    fuzzy = request.args.get("fuzzy") == "1"
    try:
        page = max(1, min(int(request.args.get("page", "1")), 1_000_000))
        per_page = max(10, min(int(request.args.get("per_page", str(PAGE_SIZE_DEFAULT))), PAGE_SIZE_MAX))
    except (TypeError, ValueError):
        page, per_page = 1, PAGE_SIZE_DEFAULT

    try:
        active_filters = {
            col: (request.args.get("filter_" + col) or "").strip()
            for col in DB_COLUMNS if col != PRIMARY_KEY
        }
        active_filters = {col: val for col, val in active_filters.items() if val}
        start = (page - 1) * per_page
        cols_sql = ", ".join(qident(c) for c in DB_COLUMNS)
        capped = False

        if query_text:
            # Tantivy supplies the candidate set for the top search. Filters
            # are deliberately applied to actual SQLite values below, because
            # the UI supports substring matching (including partial words).
            query = build_combined_query(
                query_text, active_filters, DB_COLUMNS, PRIMARY_KEY, fuzzy
            )
            if query is None:
                rows, total = [], 0
            else:
                searcher = SEARCH_INDEX.searcher()
                result = searcher.search(query, limit=MAX_SEARCH_HITS)
                candidate_count = int(result.count)
                capped = candidate_count > MAX_SEARCH_HITS
                hit_ids = []
                for _, address in result.hits:
                    document = searcher.doc(address)
                    rid = document.get_first("rid")
                    if rid is not None:
                        hit_ids.append(int(rid))

                # When filters are active, inspect all candidates before
                # pagination. Without filters, fetch only the requested page.
                ids_to_fetch = hit_ids if active_filters else hit_ids[start:start + per_page]
                rows_by_id = {}
                with readonly_connection() as conn:
                    for offset in range(0, len(ids_to_fetch), 700):
                        batch = ids_to_fetch[offset:offset + 700]
                        if not batch:
                            continue
                        marks = ",".join("?" for _ in batch)
                        found = conn.execute(
                            f"SELECT {cols_sql} FROM {qident(TABLE_NAME)} "
                            f"WHERE {qident(PRIMARY_KEY)} IN ({marks})",
                            batch,
                        ).fetchall()
                        rows_by_id.update({int(row[PRIMARY_KEY]): dict(row) for row in found})

                if active_filters:
                    matched_rows = []
                    for rid in hit_ids:
                        row = rows_by_id.get(rid)
                        if row is None:
                            continue
                        if all(
                            value.casefold() in str(row.get(column) or "").casefold()
                            for column, value in active_filters.items()
                        ):
                            matched_rows.append(row)
                    total = len(matched_rows)
                    rows = matched_rows[start:start + per_page]
                else:
                    total = min(candidate_count, MAX_SEARCH_HITS)
                    rows = [rows_by_id[rid] for rid in ids_to_fetch if rid in rows_by_id]

        elif active_filters:
            # Filter-only mode uses SQLite substring matching directly. This
            # avoids false negatives for partial words that are not standalone
            # Tantivy tokens.
            where_parts = [
                f"instr(lower(coalesce({qident(column)}, '')), lower(?)) > 0"
                for column in active_filters
            ]
            values = list(active_filters.values())
            where_sql = " WHERE " + " AND ".join(where_parts)
            with readonly_connection() as conn:
                total = int(conn.execute(
                    f"SELECT COUNT(*) FROM {qident(TABLE_NAME)}{where_sql}", values
                ).fetchone()[0])
                found = conn.execute(
                    f"SELECT {cols_sql} FROM {qident(TABLE_NAME)}{where_sql} "
                    f"ORDER BY {qident(PRIMARY_KEY)} LIMIT ? OFFSET ?",
                    values + [per_page, start],
                ).fetchall()
            rows = [dict(row) for row in found]

        else:
            with readonly_connection() as conn:
                total = int(conn.execute(
                    f"SELECT COUNT(*) FROM {qident(TABLE_NAME)}"
                ).fetchone()[0])
                found = conn.execute(
                    f"SELECT {cols_sql} FROM {qident(TABLE_NAME)} "
                    f"ORDER BY {qident(PRIMARY_KEY)} LIMIT ? OFFSET ?",
                    (per_page, start),
                ).fetchall()
            rows = [dict(row) for row in found]

        pages = max(1, (total + per_page - 1) // per_page)
        return jsonify(
            ok=True, query=query_text, fuzzy=fuzzy, total=total,
            page=page, per_page=per_page, pages=pages, capped=capped,
            max_search_hits=MAX_SEARCH_HITS if query_text else None,
            rows=rows, columns=DB_COLUMNS, primary_key=PRIMARY_KEY,
            labels=get_labels(DB_COLUMNS), filters=active_filters,
        )
    except Exception as exc:
        log(f"Search error: {type(exc).__name__}: {exc}")
        return jsonify(ok=False, error=f"جستجو ناموفق: {type(exc).__name__}: {exc}"), 400

@app.get("/api/row/<int:row_id>")
def row_detail(row_id: int):
    try:
        cols_sql = ", ".join(qident(c) for c in DB_COLUMNS)
        with readonly_connection() as conn:
            row = conn.execute(
                f"SELECT {cols_sql} FROM {qident(TABLE_NAME)} "
                f"WHERE {qident(PRIMARY_KEY)}=? LIMIT 1",
                (row_id,),
            ).fetchone()
        if row is None:
            return jsonify(ok=False, error="رکورد پیدا نشد."), 404
        return jsonify(ok=True, row=dict(row), columns=DB_COLUMNS, labels=get_labels(DB_COLUMNS))
    except Exception as exc:
        return jsonify(ok=False, error=str(exc)), 500

@app.errorhandler(404)
def not_found(_):
    return jsonify(ok=False, error="مسیر پیدا نشد."), 404

if __name__ == "__main__":
    log(f"Database: {DB_PATH}")
    log(f"Index: {INDEX_DIR}")
    log(f"Listening: http://{HOST}:{PORT}")
    app.run(host=HOST, port=PORT, debug=False, threaded=True)
