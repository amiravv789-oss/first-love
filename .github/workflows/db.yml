}
POSITION_LABELS = [
    "شناسه", "کد ملی", "نام و نام خانوادگی", "نام پدر", "تاریخ تولد",
    "محل تولد", "آدرس", "شهر", "استان", "کد پستی", "شماره موبایل",
    "تلفن", "سایر اطلاعات",
]

def qident(value: str) -> str:
    return '"' + str(value).replace('"', '""') + '"'

def normalize_name(value: str) -> str:
    return re.sub(r"[^a-z0-9]", "", str(value).lower())

def readonly_connection():
    if not DB_PATH.is_file():
        raise FileNotFoundError(f"Database not found: {DB_PATH}")
    conn = sqlite3.connect(DB_PATH.as_uri() + "?mode=ro", uri=True, timeout=60)
    conn.row_factory = sqlite3.Row
    conn.execute("PRAGMA query_only=ON")
    conn.execute("PRAGMA busy_timeout=60000")
    return conn

def detect_table(conn):
    found = []
    tables = conn.execute(
        "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
    ).fetchall()
    for item in tables:
        table = item[0]
        info = conn.execute(f"PRAGMA table_info({qident(table)})").fetchall()
        pk = [col for col in info if int(col[5]) > 0]
        if len(info) == 13 and len(pk) == 1 and str(pk[0][2]).upper() == "INTEGER":
            found.append((table, info, pk[0]))
    if len(found) != 1:
        raise RuntimeError(f"Could not uniquely detect the 13-column primary table ({len(found)} candidates).")
    table, info, pk = found[0]
    columns = [col[1] for col in info]
    if columns.index(pk[1]) != 0:
        raise RuntimeError("Primary key is not the first column; index row-id mapping cannot be assumed.")
    return table, info, columns, pk[1]

def get_labels(columns):
    labels = {}
    for i, column in enumerate(columns):
        norm = normalize_name(column)
        label = FIELD_LABELS.get(norm)
        if not label:
            label = POSITION_LABELS[i] if i < len(POSITION_LABELS) else f"اطلاعات {i+1}"
        labels[column] = label
    return labels

def get_index_field_map(columns):
    # Tantivy index was built with C2..C13 corresponding to SQLite columns 2..13.
    return {columns[i-1]: f"C{i}" for i in range(2, 14)}

def tokenize(text: str) -> list[str]:
    # Unicode-aware: keeps Persian/Arabic letters and digits.
    return re.findall(r"[^\W_]+", text, flags=re.UNICODE)

def build_combined_query(query_text, filters, columns, pk, fuzzy):
    """Create one Tantivy query: main-search AND every field-specific filter.

    The index uses BASIC postings (no positions), so terms are deliberately
    unquoted. Every main-query token may match any allowed main-search field;
    every filter token must match its own mapped column. SQLite performs the
    final substring verification after Tantivy candidate retrieval.
    """
    index_fields = [f"C{i}" for i in range(2, 14)]
    clauses = []

    # If a father-name filter is active, interpret the top search as a person's
    # name search. This prevents a query term found only in the father's name,
    # address, or another unrelated column from qualifying a different person.
    main_fields = list(index_fields)
    labels = get_labels(columns)
    father_filter_active = any(
        value and "پدر" in labels.get(column, "")
        for column, value in filters.items()
    )
    if father_filter_active:
        name_columns = [
            column for column in columns
            if column != pk and (
                "نام و نام خانوادگی" in labels.get(column, "")
                or "نام کامل" in labels.get(column, "")
            )
        ]
        mapped = [INDEX_FIELD_MAP[c] for c in name_columns if c in INDEX_FIELD_MAP]
        if mapped:
            main_fields = mapped

    main_tokens = tokenize(query_text)
    if len(main_tokens) > 16:
        raise ValueError("حداکثر ۱۶ واژه در جستجوی اصلی مجاز است.")
    if main_tokens:
        token_groups = []
        for token in main_tokens:
            # Tokens contain only Unicode letters/digits, so no query syntax
            # characters can escape into the Tantivy parser.
            token_groups.append(
                "(" + " OR ".join(f"{field}:{token}" for field in main_fields) + ")"
            )
        main_string = " AND ".join(token_groups)
        fuzzy_map = {field: (False, 1, True) for field in main_fields} if fuzzy else {}
        clauses.append(SEARCH_INDEX.parse_query(
            main_string,
            main_fields,
            fuzzy_fields=fuzzy_map,
            conjunction_by_default=True,
        ))

    # Do not push filters into Tantivy: UI filters are substring filters, while
    # the index stores whole tokens. Pushing them into Tantivy would silently
    # drop valid partial matches. The API verifies filters against SQLite rows.

    if not clauses:
        return None
    if len(clauses) == 1:
        return clauses[0]
    return tantivy.Query.boolean_query([(tantivy.Occur.Must, clause) for clause in clauses])


def discover_filter_columns(columns, pk):
    # Offer every non-primary field as a filter, with semantic labels.
    return [c for c in columns if c != pk]


