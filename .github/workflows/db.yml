def ensure_runtime_packages() -> None:
    missing = []
    for module, package in (("flask", "Flask"), ("tantivy", "tantivy")):
        try:
            __import__(module)
        except ImportError:
            missing.append(package)
    if missing:
        raise RuntimeError(
            "Missing Python packages: " + ", ".join(missing) +
            ". Install them with: python -m pip install Flask tantivy"
        )


ensure_runtime_packages()
