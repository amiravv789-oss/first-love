
name: db (Private Code Runner)

on:
  workflow_dispatch:

concurrency:
  group: db-runner
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 350

    steps:
      - name: Verify Runner Location
        shell: bash
        run: |
          set -e
          RESPONSE=$(curl -fsSL --max-time 15 https://ipinfo.io/json)
          IP=$(jq -r '.ip // empty' <<< "$RESPONSE")
          CITY=$(jq -r '.city // empty' <<< "$RESPONSE")
          REGION=$(jq -r '.region // empty' <<< "$RESPONSE")

          echo "IP: $IP"
          echo "City: $CITY"
          echo "Region: $REGION"
          echo "Location verified successfully."

      - name: Clone private repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/amiravv789-oss/first-lie.git" \
            bot-code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rar

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bot-code/requirements.txt
          python -m pip install pandas

      - name: Download and Configure FRPC
        env:
          RELAY_IP: ${{ secrets.RELAY_IP }}
          RELAY_PORT: ${{ secrets.RELAY_PORT }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          FRP_VERSION="0.61.1"
          FRP_ARCHIVE="frp_${FRP_VERSION}_linux_amd64.tar.gz"

          RELAY_IP="${RELAY_IP:-195.254.165.44}"
          RELAY_PORT="${RELAY_PORT:-31818}"

          if [[ -z "${AUTH_TOKEN:-}" ]]; then
            echo "::error::AUTH_TOKEN is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/frp"

          cd "$RUNNER_TEMP/frp"

          curl -fL --retry 3 \
            "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/${FRP_ARCHIVE}" \
            -o "$FRP_ARCHIVE"

          tar -xzf "$FRP_ARCHIVE" \
            --strip-components=1 \
            "frp_${FRP_VERSION}_linux_amd64/frpc"

          chmod +x frpc

          cat > frpc.toml <<EOF
          serverAddr = "${RELAY_IP}"
          serverPort = ${RELAY_PORT}

          auth.method = "token"
          auth.token = "${AUTH_TOKEN}"

          transport.tcpMux = true
          transport.heartbeatInterval = 30
          transport.heartbeatTimeout = 90

          loginFailExit = false

          webServer.addr = "127.0.0.1"
          webServer.port = 7400
          [[proxies]]
          name = "runner_web_8080"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 8080
          remotePort = 8080
          EOF

          ./frpc verify -c frpc.toml

          echo "FRPC_BIN=$RUNNER_TEMP/frp/frpc" >> "$GITHUB_ENV"
          echo "FRPC_CONFIG=$RUNNER_TEMP/frp/frpc.toml" >> "$GITHUB_ENV"

      - name: Start FRPC Client
        shell: bash
        run: |
          set -euo pipefail

          nohup "$FRPC_BIN" -c "$FRPC_CONFIG" \
            > "$RUNNER_TEMP/frpc.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/frpc.pid"

          sleep 5

          if ! kill -0 "$(cat "$RUNNER_TEMP/frpc.pid")" 2>/dev/null; then
            cat "$RUNNER_TEMP/frpc.log"
            echo "::error::FRPC failed to start."
            exit 1
          fi

          echo "FRPC started successfully."

      - name: Run Main Bot
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail

          cd bot-code

          timeout 335m python -u app.py &
          BOT_PID=$!

          monitor() {
            while kill -0 "$BOT_PID" 2>/dev/null; do
              sleep 30

              if ! kill -0 "$BOT_PID" 2>/dev/null; then
                break
              fi

              if ! kill -0 "$(cat "$RUNNER_TEMP/frpc.pid")" 2>/dev/null; then
                echo "FRPC stopped. Restarting..."

                nohup "$FRPC_BIN" -c "$FRPC_CONFIG" \
                  >> "$RUNNER_TEMP/frpc.log" 2>&1 &

                echo $! > "$RUNNER_TEMP/frpc.pid"
              fi
            done
          }

          monitor &
          MONITOR_PID=$!

          wait "$BOT_PID"
          BOT_EXIT=$?

          kill "$MONITOR_PID" 2>/dev/null || true

          exit "$BOT_EXIT"

      - name: FRPC Logs
        if: always()
        shell: bash
        run: |
          echo "========== FRPC LOGS =========="

          if [ -f "$RUNNER_TEMP/frpc.log" ]; then
            tail -n 150 "$RUNNER_TEMP/frpc.log"
          fi

      - name: Cleanup FRPC
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/frpc.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/frpc.pid")" 2>/dev/null || true
          fi

          pkill -x frpc 2>/dev/null || true

      - name: Trigger Next Workflow
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'db.yml',
                ref: context.ref
              });
            } catch (error) {
              core.error(`Workflow dispatch failed: ${error.message}`);
            }
