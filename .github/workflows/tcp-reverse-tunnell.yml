name: Run TCP reverse tunnel and measure VLESS proxy delay

on:
  workflow_dispatch:


permissions:
  contents: write
  actions: write

concurrency:
  group: tcp-reverse-tunnel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: agent/go.sum

      - name: Log Runner region, start Xray and reverse tunnel, test VLESS delay
        timeout-minutes: 345
        env:
          # Existing environment/settings retained from the original workflow.
          XRAY_VERSION: v26.9.30
          TUNNEL_ADDR: "remote-respina-free.runflare.com:31889"
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          TUNNEL_TLS_SHA256: ''
          ALLOW_PORTS: "443,8443,1080,8081"
          VLESS_UUID: "6c7ff9a7-eeb3-441f-b11c-bcf30f14a16e"
          VMESS_UUID: "6c7ff9a7-eeb3-441f-b11c-bcf30f14a16e"
          SOCKS_USERNAME: "SOCKS"
          SOCKS_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          HTTP_USERNAME: "HTTP"
          HTTP_PASSWORD: ${{ secrets.SSH_PASSWORD }}

          # Fixed test endpoint: no workflow_dispatch inputs required.
          PROXY_TEST_HOST: "remote-respina-free.runflare.com"
          PROXY_TEST_PORT: "32046"
          PROXY_TEST_CLIENT_HOST: "relay.internal"
          MAX_RUNS: "5"
          ITERATION: ${{ github.event.client_payload.iteration || 1 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          echo "========== RUNNER IDENTITY =========="
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Run number: ${GITHUB_RUN_NUMBER}"
          echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "Iteration: ${ITERATION}"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner architecture: ${RUNNER_ARCH}"
          echo "Runner environment: ${RUNNER_ENVIRONMENT}"
          echo "UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "========== RUNNER PUBLIC IP / GEOIP =========="
          curl -fsS --retry 2 --connect-timeout 5 --max-time 12 https://ipinfo.io/json \
            || echo "GeoIP lookup failed"
          echo
          echo "GeoIP estimates the egress IP location; it does not guarantee the physical Runner location."

          if [[ -z "${TUNNEL_ADDR}" || -z "${TUNNEL_TOKEN:-}" ]]; then
            echo "::error::Set the existing TUNNEL_ADDR and TUNNEL_TOKEN values."
            exit 1
          fi
          if [[ "${#TUNNEL_TOKEN}" -lt 32 ]]; then
            echo "::error::TUNNEL_TOKEN must be at least 32 characters."
            exit 1
          fi
          case "${TUNNEL_ADDR}" in
            *://*) echo "::error::TUNNEL_ADDR must be host:port, not a URL."; exit 1 ;;
          esac
          if [[ -z "${SOCKS_PASSWORD:-}" ]]; then
            echo "::error::Set repository secret SSH_PASSWORD."
            exit 1
          fi
          if [[ "${PROXY_TEST_PORT}" != "32046" ]]; then
            echo "::error::PROXY_TEST_PORT must be exactly 32046; refusing to test another port."
            exit 1
          fi

          echo "========== TEST ENDPOINT =========="
          echo "Relay public endpoint: ${PROXY_TEST_HOST}:${PROXY_TEST_PORT}"
          echo "Tunnel control endpoint: ${TUNNEL_ADDR}"

          echo "========== GENERATED PLAINTEXT VLESS PROFILE MATRIX =========="
          # These are candidate client URIs based on the user's supplied Host/SNI
          # values. Security-related parameters are intentionally omitted/disabled.
          # SNI is retained as a label/compatibility test field only; it has no TLS
          # effect when security=none. The active reverse relay must map public
          # port 32046 to a matching inbound transport for a profile to connect.
          python3 - <<'PYPROFILES'
          from urllib.parse import urlencode, quote
          import os
          uid = os.environ['VLESS_UUID']
          endpoint = os.environ['PROXY_TEST_HOST']
          port = os.environ['PROXY_TEST_PORT']
          # Keep the exact SNI string supplied by the user in every generated
          # URI for completeness/inspection. With security=none it is inert: SNI
          # is a TLS ClientHello field and cannot affect a plaintext connection.
          default_sni = 'br1q4t7w0z3c6f9i2l5o8r1u4x7a0d3g6j9m2p5s8v.mobileahmadreza.ir'
          profiles = [
              ('TCP-None', 'tcp', 'none', '', '', '', 'auto'),
              ('TCP-HTTP-connectivitycheck', 'tcp', 'http', 'connectivitycheck.android.com', '', '', 'auto'),
              ('TCP-HTTP-play-google', 'tcp', 'http', 'play.google.com', '', '', 'auto'),
              ('TCP-HTTP-dynu', 'tcp', 'http', 'dynu.com', '', '', 'auto'),
              ('TCP-HTTP-tgju', 'tcp', 'http', 'tgju.org', '', '', 'auto'),
              ('HTTPUpgrade-connectivitycheck', 'httpupgrade', '', 'connectivitycheck.android.com', '/', '', 'auto'),
              ('HTTPUpgrade-play-google', 'httpupgrade', '', 'play.google.com', '/', '', 'auto'),
              ('XHTTP-auto-mobileahmadreza', 'xhttp', '', 'mobileahmadreza.ir', '/?ed=2048', default_sni, 'auto'),
              ('XHTTP-stream-up-re', 'xhttp', '', 're.lanzivo.ir', '/', default_sni, 'stream-up'),
              ('XHTTP-stream-up-zm', 'xhttp', '', 'zm.lanzivo.ir', '/', default_sni, 'stream-up'),
              ('XHTTP-stream-up-we', 'xhttp', '', 'we.lanzivo.ir', '/', default_sni, 'stream-up'),
              ('XHTTP-auto-aparat-SNI', 'xhttp', '', 'soft98.ir', '/', default_sni, 'auto'),
              ('XHTTP-auto-firefox-SNI-fastly', 'xhttp', '', 'ukcoreshopingmove.global.ssl.fastly.net', '/?ed=2048', default_sni, 'auto'),
              ('XHTTP-auto-steamstatic-SNI-fastly', 'xhttp', '', 'hdhdh.global.ssl.fastly.net', '/?ed=2048', default_sni, 'auto'),
              ('XHTTP-auto-cdn-SNI-fastly', 'xhttp', '', 'anazshopmarket.global.ssl.fastly.net', '/', default_sni, 'auto'),
              ('XHTTP-auto-connectivitycheck', 'xhttp', '', 'connectivitycheck.android.com', '/', default_sni, 'auto'),
              ('XHTTP-auto-cde-azrping', 'xhttp', '', 'cde.azrping.com', '/', default_sni, 'auto'),
          ]
          for name, transport, header, host, path, sni, mode in profiles:
              q = {'encryption': 'none', 'security': 'none', 'type': transport, 'sni': sni or default_sni}
              if header:
                  q['headerType'] = header
              if host:
                  q['host'] = host
              if path:
                  q['path'] = path
              if transport == 'xhttp':
                  q['mode'] = mode
                  # Known non-security XHTTP padding option from the supplied URI.
                  q['extra'] = '{"xPaddingBytes":"100-1000"}'
              uri = f"vless://{uid}@{endpoint}:{port}?{urlencode(q)}#{quote(name)}"
              print(uri)
          print(f"Generated {len(profiles)} plaintext profile candidates; SNI is retained as requested but is not active with security=none.")
          PYPROFILES

          case "$(uname -m)" in
            x86_64|amd64)
              asset="Xray-linux-64.zip"
              sum="f851110beaff16e78d643f0ccfd9524b4a44dfd59bae3e34bb52bba378f7690e"
              ;;
            aarch64|arm64)
              asset="Xray-linux-arm64-v8a.zip"
              sum="9886f077f9fd8e6713b84c377c1c7db4e53b9bfa8c276a5bd12561139522b473"
              ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          work="${RUNNER_TEMP}/xray-dist"
          mkdir -p "${work}"
          curl -fL --retry 5 --retry-delay 2 -o "${work}/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${asset}"
          echo "${sum}  ${work}/xray.zip" | sha256sum -c -
          python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "${work}/xray.zip" "${work}/files"
          sudo install -d -m 0755 /usr/local/bin /usr/local/share/xray
          sudo install -m 0755 "${work}/files/xray" /usr/local/bin/xray
          sudo install -m 0644 "${work}/files/geoip.dat" "${work}/files/geosite.dat" /usr/local/share/xray/
          xray version

          # Keep compatibility with the existing workflow's inbound ports.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0 >/dev/null
          export XRAY_CONFIG="${RUNNER_TEMP}/xray-config.json"

          python3 - <<'PY'
          import json, os, uuid

          def need(key):
              value = os.environ.get(key, "")
              if not value:
                  raise SystemExit(f"missing required value: {key}")
              return value

          def need_uuid(key):
              value = need(key)
              uuid.UUID(value)
              return value

          password = need("SOCKS_PASSWORD")
          uid = need_uuid("VLESS_UUID")
          cfg = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {
                      "tag": "vless-in",
                      "listen": "127.0.0.1",
                      "port": 443,
                      "protocol": "vless",
                      "settings": {
                          "clients": [{"id": uid}],
                          "decryption": "none"
                      },
                      "streamSettings": {
                          "network": "tcp",
                          "security": "none"
                      }
                  },
                  {
                      "tag": "vless-httpupgrade-in",
                      "listen": "0.0.0.0",
                      "port": 8443,
                      "protocol": "vless",
                      "settings": {
                          "clients": [{"id": uid}],
                          "decryption": "none"
                      },
                      "streamSettings": {
                          "network": "httpupgrade",
                          "security": "none",
                          "httpupgradeSettings": {
                              "path": "/",
                              "host": "connectivitycheck.android.com"
                          }
                      }
                  },
                  {
                      "tag": "socks-in",
                      "listen": "127.0.0.1",
                      "port": 1080,
                      "protocol": "socks",
                      "settings": {
                          "auth": "password",
                          "accounts": [{
                              "user": need("SOCKS_USERNAME"),
                              "pass": password
                          }],
                          "udp": False
                      }
                  },
                  {
                      "tag": "http-in",
                      "listen": "127.0.0.1",
                      "port": 8081,
                      "protocol": "http",
                      "settings": {
                          "accounts": [{
                              "user": need("HTTP_USERNAME"),
                              "pass": need("HTTP_PASSWORD")
                          }],
                          "allowTransparent": False
                      }
                  }
              ],
              "outbounds": [{
                  "tag": "direct",
                  "protocol": "freedom",
                  "settings": {}
              }],
              "routing": {
                  "domainStrategy": "AsIs",
                  "rules": []
              }
          }
          path = os.environ["XRAY_CONFIG"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f)
          os.chmod(path, 0o600)
          PY

          xray run -test -c "${XRAY_CONFIG}"

          xlog="${RUNNER_TEMP}/xray.log"
          alog="${RUNNER_TEMP}/tunnel-agent.log"
          clog="${RUNNER_TEMP}/xray-client.log"
          XPID=""
          APID=""
          CPID=""
          cleanup() {
            [[ -n "${CPID}" ]] && kill "${CPID}" 2>/dev/null || true
            [[ -n "${APID}" ]] && kill "${APID}" 2>/dev/null || true
            [[ -n "${XPID}" ]] && kill "${XPID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          env -u TUNNEL_TOKEN -u TUNNEL_TLS_SHA256 -u TUNNEL_ADDR \
            xray run -c "${XRAY_CONFIG}" >"${xlog}" 2>&1 &
          XPID=$!

          if ! python3 - <<'PY'
          import socket, sys, time
          ports = [443, 8443, 1080, 8081]
          missing = ports
          for _ in range(30):
              missing = []
              for port in ports:
                  s = socket.socket()
                  s.settimeout(0.4)
                  try:
                      s.connect(("127.0.0.1", port))
                  except OSError:
                      missing.append(port)
                  finally:
                      s.close()
              if not missing:
                  print("All local Xray inbounds are listening.")
                  sys.exit(0)
              time.sleep(1)
          sys.exit("Xray did not open ports: " + ",".join(map(str, missing)))
          PY
          then
            cat "${xlog}" >&2 || true
            exit 1
          fi

          (
            cd "${GITHUB_WORKSPACE}/agent"
            go build -mod=vendor -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/tunnel-agent" .
          )
          "${RUNNER_TEMP}/tunnel-agent" >"${alog}" 2>&1 &
          APID=$!

          echo "========== WAIT FOR REVERSE TUNNEL =========="
          sleep 12
          tail -n 40 "${alog}" || true

          echo "========== TCP REACHABILITY CHECK (FIXED PORT 32046) =========="
          python3 - <<'PY'
          import os, socket, time
          host = os.environ["PROXY_TEST_HOST"]
          port = int(os.environ["PROXY_TEST_PORT"])
          samples = []
          for i in range(5):
              start = time.perf_counter()
              try:
                  with socket.create_connection((host, port), timeout=8):
                      ms = (time.perf_counter() - start) * 1000
                      samples.append(ms)
                      print(f"TCP sample {i+1}: {ms:.2f} ms")
              except Exception as e:
                  print(f"TCP sample {i+1}: FAILED ({e})")
              time.sleep(1)
          if samples:
              print(f"TCP min/avg/max: {min(samples):.2f}/{sum(samples)/len(samples):.2f}/{max(samples):.2f} ms")
          else:
              print("No TCP samples succeeded. The relay may not expose this public port.")
          PY

          echo "========== REAL VLESS / HTTPUpgrade PROXY TEST (FIXED PORT 32046) =========="
          # Xray 26.9.30 blocks plaintext VLESS outbound to public domains.
          # relay.internal is a local-only private-domain alias mapped to the relay's resolved IPv4.
          # The TCP destination remains the relay endpoint on port 32046; no relay settings change.
          relay_ip="$(python3 - <<'PY'
          import os, socket, sys
          host = os.environ["PROXY_TEST_HOST"]
          try:
              values = sorted({item[4][0] for item in socket.getaddrinfo(host, None, socket.AF_INET, socket.SOCK_STREAM)})
          except OSError as exc:
              sys.exit(f"Could not resolve relay host {host}: {exc}")
          if not values:
              sys.exit(f"No IPv4 address found for relay host {host}")
          print(values[0])
          PY
          )"
          echo "Relay resolved IPv4: ${relay_ip}"
          echo "${relay_ip} ${PROXY_TEST_CLIENT_HOST}" | sudo tee -a /etc/hosts >/dev/null
          export XRAY_CLIENT_CONFIG="${RUNNER_TEMP}/xray-client.json"
          python3 - <<'PY'
          import json, os, uuid
          uid = os.environ["VLESS_UUID"]
          uuid.UUID(uid)
          cfg = {
              "log": {"loglevel": "warning"},
              "inbounds": [{
                  "tag": "test-socks-in",
                  "listen": "127.0.0.1",
                  "port": 10808,
                  "protocol": "socks",
                  "settings": {"udp": False}
              }],
              "outbounds": [{
                  "tag": "test-vless-out",
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": os.environ["PROXY_TEST_CLIENT_HOST"],
                          "port": int(os.environ["PROXY_TEST_PORT"]),
                          "users": [{"id": uid, "encryption": "none"}]
                      }]
                  },
                  "streamSettings": {
                      "network": "httpupgrade",
                      "security": "none",
                      "httpupgradeSettings": {
                          "path": "/",
                          "host": "connectivitycheck.android.com"
                      }
                  }
              }]
          }
          path = os.environ["XRAY_CLIENT_CONFIG"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f)
          os.chmod(path, 0o600)
          PY

          if xray run -test -c "${XRAY_CLIENT_CONFIG}"; then
            xray run -c "${XRAY_CLIENT_CONFIG}" >"${clog}" 2>&1 &
            CPID=$!
            python3 - <<'PY'
          import socket, sys, time
          for _ in range(25):
              s = socket.socket()
              s.settimeout(.3)
              try:
                  s.connect(("127.0.0.1", 10808))
                  s.close()
                  print("Xray test SOCKS listener is ready.")
                  sys.exit(0)
              except OSError:
                  s.close()
                  time.sleep(1)
          sys.exit("Xray test client did not open port 10808")
          PY
            vless_ok=0
            vless_failed=0
            for i in 1 2 3 4 5; do
              echo "--- VLESS HTTP request ${i}/5 via ${PROXY_TEST_HOST}:${PROXY_TEST_PORT} ---"
              if result=$(curl --silent --show-error --output /dev/null \
                --socks5-hostname 127.0.0.1:10808 \
                --connect-timeout 12 --max-time 25 \
                --write-out 'http_code=%{http_code} total=%{time_total}s connect=%{time_connect}s tls=%{time_appconnect}s' \
                https://www.gstatic.com/generate_204); then
                echo "${result}"
                if [[ "${result}" == http_code=204* ]]; then
                  vless_ok=$((vless_ok + 1))
                  echo "VLESS_RESULT=PASS"
                else
                  vless_failed=$((vless_failed + 1))
                  echo "VLESS_RESULT=FAIL (unexpected HTTP status)"
                fi
              else
                rc=$?
                vless_failed=$((vless_failed + 1))
                echo "VLESS_RESULT=FAIL (curl exit ${rc})"
              fi
              sleep 1
            done
            echo "VLESS requests passed: ${vless_ok}/5; failed: ${vless_failed}/5"
            if (( vless_ok == 0 )); then
              echo "::warning::No HTTP request succeeded through VLESS on fixed port 32046. Check the existing relay port mapping to Runner port 8443."
            fi
            kill "${CPID}" 2>/dev/null || true
            CPID=""
            echo "========== XRAY CLIENT LOG =========="
            tail -n 60 "${clog}" || true
          else
            echo "Xray client config validation failed; proxy test skipped."
          fi

          echo "========== TEST SUMMARY =========="
          echo "Runner egress IP and approximate GeoIP are logged above."
          echo "TCP samples measure Runner -> relay public endpoint."
          echo "VLESS request times are real HTTP requests through the configured VLESS/HTTPUpgrade client at fixed public port 32046."
          echo "The workflow refuses to run if PROXY_TEST_PORT is anything other than 32046."
          echo "If the proxy test fails, verify that the relay's existing mapping exposes ${PROXY_TEST_HOST}:32046 to this Runner's port 8443. The client uses a local-only private-domain alias to satisfy Xray's plaintext-VLESS validation rule; its resolved address is the relay IPv4."
          echo "No changes are made to the relay server by this workflow."

          echo "========== KEEPING XRAY AND REVERSE TUNNEL ALIVE =========="
          while kill -0 "${XPID}" 2>/dev/null && kill -0 "${APID}" 2>/dev/null; do
            sleep 5
          done
          echo "Xray or the tunnel agent exited." >&2
          tail -n 80 "${xlog}" >&2 || true
          tail -n 80 "${alog}" >&2 || true
          exit 1

      - name: Retrigger
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "tcp-reverse-tunnell.yml",
                ref: context.ref
              });
            } catch (e) {
              console.log(e.message);
            }
