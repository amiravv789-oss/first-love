name: Extract ZIP files
on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write   # برای commit و push معمولی

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # ← اینجا از PAT استفاده کن (نه GITHUB_TOKEN)
          fetch-depth: 0

      - name: Find and extract ZIP files
        run: |
          set -e
          find . -type f -name "*.zip" -print0 | while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            dir=$(dirname "$zipfile")
            unzip -o -q "$zipfile" -d "$dir"
            rm -f "$zipfile"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract ZIP files and remove archives"
            git push
          fi
