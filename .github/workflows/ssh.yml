name: SSH Tunnel Host

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          lfs: true

      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client git-lfs expect
          git lfs install
          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config || true
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          echo "root:tunnelpass" | sudo chpasswd
          sudo service ssh restart || sudo /usr/sbin/sshd

      - name: Prepare
        run: |
          mkdir -p state
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Tunnel loop
        run: |
          echo "=== Start $(date) ===" >> state/ssh-history.log
          END=$(($(date +%s) + 340*60))

          while [ $(date +%s) -lt $END ]; do
            echo "[$(date)] Starting tunnel..." | tee -a state/ssh-history.log
            > tunnel-out.log

            expect -c '
              set timeout 3300
              spawn timeout 55m ssh -p 443 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ServerAliveInterval=30 \
                -o ConnectTimeout=30 \
                -R0:localhost:22 \
                tcp@free.pinggy.io
              expect {
                -re "(?i)password:" { send "\r"; exp_continue }
                eof
              }
            ' > tunnel-out.log 2>&1 &

            PID=$!

            LINK=""
            for i in $(seq 1 40); do
              sleep 2
              LINK=$(grep -oE 'tcp://[a-zA-Z0-9.-]+\.[a-zA-Z0-9.-]+:[0-9]+' tunnel-out.log | head -1 || true)
              if [ -n "$LINK" ]; then
                break
              fi
            done

            echo "=== tunnel-out.log ===" | tee -a state/ssh-history.log
            cat tunnel-out.log | tee -a state/ssh-history.log
            echo "=== end ===" | tee -a state/ssh-history.log

            if [ -n "$LINK" ]; then
              HOST=$(echo "$LINK" | sed 's|tcp://||' | cut -d: -f1)
              PORT=$(echo "$LINK" | sed 's|tcp://||' | cut -d: -f2)

              printf '%s\n' '#!/bin/bash' "echo \"Connecting to $LINK ...\"" "ssh -o StrictHostKeyChecking=no -p $PORT root@$HOST" > client.sh
              chmod +x client.sh

              echo "[$(date)] LIVE: $LINK" | tee -a state/ssh-history.log

              git add client.sh state/ssh-history.log
              git commit -m "live client.sh: $LINK" || true
              git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true
              echo "client.sh pushed!"
            else
              echo "[$(date)] No link" | tee -a state/ssh-history.log
            fi

            wait $PID || true
            echo "[$(date)] ended, restart in 8s..." | tee -a state/ssh-history.log
            sleep 8
          done

          echo "=== End $(date) ===" >> state/ssh-history.log

      - name: Final push
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: final sync [skip ci]"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true

      - name: Retrigger
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "host.yml",
                ref: context.ref
              });
            } catch (e) {
              console.log(e.message);
            }
