name: SSH Tunnel Host

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          lfs: true

      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client git-lfs
          git lfs install
          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config || true
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          echo "root:tunnelpass" | sudo chpasswd
          sudo service ssh restart || sudo /usr/sbin/sshd

      - name: Prepare state
        run: mkdir -p state

      - name: Tunnel loop
        run: |
          echo "=== Start $(date) ===" >> state/ssh-history.log
          END=$(($(date +%s) + 340*60))

          while [ $(date +%s) -lt $END ]; do
            echo "[$(date)] New tunnel..." | tee -a state/ssh-history.log

            timeout 55m ssh -p 443 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -R0:localhost:22 \
              qr@free.pinggy.io > tunnel-out.log 2>&1 &

            PID=$!
            sleep 15

            LINK=$(grep -oE 'tcp://[^ ]+' tunnel-out.log | head -1 || true)
            if [ -n "$LINK" ]; then
              echo "$LINK" > state/last-link.txt
              echo "[$(date)] $LINK" | tee -a state/ssh-history.log

              printf '%s\n' \
                '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="30"><title>SSH Link</title>' \
                '<style>body{font-family:sans-serif;text-align:center;padding:40px;background:#111;color:#0f0}.link{font-size:1.5rem;word-break:break-all;background:#222;padding:20px;border-radius:8px}</style></head><body>' \
                '<h1>Current SSH Tunnel</h1><div class="link">'"$LINK"'</div><p>'"$(date -u)"'</p></body></html>' \
                > state/index.html
            fi

            wait $PID || true
            echo "[$(date)] ended, restart..." | tee -a state/ssh-history.log
            sleep 5
          done

          echo "=== End $(date) ===" >> state/ssh-history.log

      - name: Push everything
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git lfs track "*.zip" "*.rar" "*.db" "*.sqlite" "*.mp4" || true
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync [skip ci]"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }} || true

      - name: Retrigger
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              ref: context.ref
            }).catch(e => console.log(e.message));
