name: SSH Tunnel Host

on:
  workflow_dispatch:

concurrency:
  group: ssh-tunnel-host
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          lfs: true


      # ============================================================
      # SETUP SSH SERVER
      # ============================================================
      - name: Setup SSH server
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing SSH server"
          echo "========================================"

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            openssh-server \
            openssh-client \
            git-lfs \
            curl

          git lfs install

          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A

          # --------------------------------------------------------
          # SSH configuration
          # --------------------------------------------------------
          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin prohibit-password/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
            /etc/ssh/sshd_config

          # --------------------------------------------------------
          # Create temporary SSH key
          # --------------------------------------------------------
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f "${HOME}/.ssh/tunnel_key" \
            -C "github-actions-tunnel"

          chmod 600 "${HOME}/.ssh/tunnel_key"

          sudo mkdir -p /root/.ssh
          sudo chmod 700 /root/.ssh

          sudo cp "${HOME}/.ssh/tunnel_key.pub" /root/.ssh/authorized_keys

          sudo chmod 600 /root/.ssh/authorized_keys
          sudo chown -R root:root /root/.ssh

          # --------------------------------------------------------
          # Restart SSH
          # --------------------------------------------------------
          sudo service ssh restart || sudo /usr/sbin/sshd

          echo
          echo "SSH server is ready."


      # ============================================================
      # PREPARE STATE
      # ============================================================
      - name: Prepare state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p state

          touch state/ssh-history.log
          touch state/last-link.txt
          touch client.ssh

          echo "State directory prepared."


      # ============================================================
      # START TCP TUNNEL
      # ============================================================
      - name: Start TCP tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -uo pipefail

          END=$(($(date +%s) + 340 * 60))

          WORKFLOW_FILE=".github/workflows/ssh-tunnel-host.yml"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo
          echo "========================================"
          echo "SSH TCP TUNNEL START"
          echo "========================================"

          echo "[$(date -u)] Tunnel started" \
            | tee -a state/ssh-history.log


          # ==========================================================
          # PUSH STATE
          # ==========================================================
          push_state() {

            echo
            echo "========================================"
            echo "SYNC + PUSH STATE"
            echo "========================================"

            for ATTEMPT in 1 2 3 4 5; do

              echo "Push attempt: ${ATTEMPT}"

              # ----------------------------------------------------
              # Fetch latest main
              # ----------------------------------------------------
              git fetch origin main || true

              if git show-ref --verify --quiet refs/remotes/origin/main; then
                git reset --mixed origin/main || true
              fi

              # ----------------------------------------------------
              # Add only generated files
              # ----------------------------------------------------
              git add \
                client.ssh \
                state/

              # ----------------------------------------------------
              # Nothing changed
              # ----------------------------------------------------
              if git diff --cached --quiet; then
                echo "Nothing to push."
                return 0
              fi

              # ----------------------------------------------------
              # Commit
              # ----------------------------------------------------
              git commit \
                -m "chore: update SSH tunnel [skip ci]" \
                || true

              # ----------------------------------------------------
              # Push
              # ----------------------------------------------------
              if git push "${REPO_URL}" HEAD:main; then

                echo
                echo "State pushed successfully."

                return 0

              fi

              echo
              echo "Push rejected."
              echo "Retrying in $((ATTEMPT * 2)) seconds..."

              sleep $((ATTEMPT * 2))

            done

            echo
            echo "WARNING: Could not push state after 5 attempts."

            return 1
          }


          # ==========================================================
          # CREATE CLIENT
          # ==========================================================
          create_client() {

            LINK="$1"

            echo
            echo "========================================"
            echo "CREATING CLIENT"
            echo "========================================"

            echo "Tunnel: ${LINK}"

            # ------------------------------------------------------
            # Remove tcp://
            # ------------------------------------------------------
            ADDRESS="${LINK#tcp://}"

            # ------------------------------------------------------
            # Extract host
            # ------------------------------------------------------
            HOST="${ADDRESS%:*}"

            # ------------------------------------------------------
            # Extract port
            # ------------------------------------------------------
            PORT="${ADDRESS##*:}"

            # ------------------------------------------------------
            # Validate
            # ------------------------------------------------------
            if [ -z "${HOST}" ]; then
              echo "ERROR: Empty host."
              return 1
            fi

            if [ -z "${PORT}" ]; then
              echo "ERROR: Empty port."
              return 1
            fi

            if [ "${HOST}" = "${ADDRESS}" ]; then
              echo "ERROR: Could not parse TCP endpoint."
              echo "LINK=${LINK}"
              return 1
            fi

            echo "HOST = ${HOST}"
            echo "PORT = ${PORT}"


            # ======================================================
            # SAVE RAW LINK
            # ======================================================
            printf '%s\n' "${LINK}" > state/last-link.txt


            # ======================================================
            # COPY PRIVATE KEY
            # ======================================================
            cp "${HOME}/.ssh/tunnel_key" ./tunnel_key

            chmod 600 ./tunnel_key


            # ======================================================
            # CREATE CLIENT SCRIPT
            # ======================================================
            cat > client.ssh <<EOF
#!/usr/bin/env bash

set -euo pipefail

HOST="${HOST}"
PORT="${PORT}"
USER="root"

TMP_DIR="\$(mktemp -d)"
trap 'rm -rf "\$TMP_DIR"' EXIT

echo
echo "========================================"
echo " GitHub Actions SSH Tunnel"
echo "========================================"
echo
echo "Host : \$HOST"
echo "Port : \$PORT"
echo
echo "Downloading temporary SSH key..."
echo

curl -fsSL \
  "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/tunnel_key" \
  -o "\$TMP_DIR/tunnel_key"

chmod 600 "\$TMP_DIR/tunnel_key"

echo "Connecting..."
echo

exec ssh \
  -i "\$TMP_DIR/tunnel_key" \
  -o IdentitiesOnly=yes \
  -o StrictHostKeyChecking=no \
  -o UserKnownHostsFile=/dev/null \
  -o ServerAliveInterval=30 \
  -o ServerAliveCountMax=3 \
  -o ConnectTimeout=30 \
  -p "\$PORT" \
  "\$USER@\$HOST"
EOF

            chmod +x client.ssh


            # ======================================================
            # HTML STATUS PAGE
            # ======================================================
            cat > state/index.html <<EOF
<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  http-equiv="refresh"
  content="30"
>

<title>SSH Tunnel</title>

<style>

body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
    background: #111;
    color: #0f0;
}

.box {
    max-width: 900px;
    margin: auto;
}

.link {
    font-size: 1.5rem;
    word-break: break-all;
    background: #222;
    padding: 20px;
    border-radius: 8px;
    margin: 20px auto;
}

.command {
    margin-top: 25px;
    background: #222;
    color: #fff;
    padding: 20px;
    border-radius: 8px;
    word-break: break-all;
    text-align: left;
}

small {
    color: #888;
}

</style>

</head>

<body>

<div class="box">

<h1>Current SSH Tunnel</h1>

<div class="link">
${LINK}
</div>

<div class="command">

curl -fsSL \
https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/client.ssh \
| bash

</div>

<p>
Updated: $(date -u)
</p>

<small>
GitHub Actions SSH Tunnel
</small>

</div>

</body>
</html>
EOF


            # ======================================================
            # PUSH
            # ======================================================
            echo
            echo "Uploading tunnel state..."

            push_state || true

            echo
            echo "Tunnel state uploaded."
          }


          # ==========================================================
          # MAIN LOOP
          # ==========================================================
          while [ "$(date +%s)" -lt "${END}" ]; do

            echo
            echo "========================================"
            echo "Starting new Pinggy TCP tunnel..."
            echo "========================================"

            echo "[$(date -u)] New tunnel..." \
              | tee -a state/ssh-history.log

            rm -f tunnel-out.log


            # ======================================================
            # START PINGGY
            # ======================================================
            timeout 55m ssh \
              -p 443 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=30 \
              -R0:localhost:22 \
              tcp@free.pinggy.io \
              > tunnel-out.log 2>&1 &

            PID=$!

            echo "Pinggy PID: ${PID}"


            # ======================================================
            # WAIT FOR TCP LINK
            # ======================================================
            LINK=""

            for i in $(seq 1 90); do

              sleep 1

              if [ -f tunnel-out.log ]; then

                LINK=$(
                  grep -oE \
                    'tcp://[^[:space:]]+' \
                    tunnel-out.log \
                    | head -1 \
                    || true
                )

              fi

              if [ -n "${LINK}" ]; then
                break
              fi

              if ! kill -0 "${PID}" 2>/dev/null; then
                break
              fi

            done


            # ======================================================
            # LINK FOUND
            # ======================================================
            if [ -n "${LINK}" ]; then

              echo
              echo "########################################"
              echo "TCP LINK FOUND"
              echo "${LINK}"
              echo "########################################"
              echo

              echo "[$(date -u)] ${LINK}" \
                | tee -a state/ssh-history.log

              create_client "${LINK}"


              echo
              echo "========================================"
              echo "CLIENT READY"
              echo "========================================"
              echo

              echo "Run on client:"
              echo

              echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/client.ssh | bash"

              echo

            else

              echo
              echo "========================================"
              echo "NO TCP LINK FOUND"
              echo "========================================"

              echo
              echo "Pinggy output:"
              echo "----------------------------------------"

              cat tunnel-out.log || true

              echo "----------------------------------------"

              echo "[$(date -u)] No TCP link found." \
                | tee -a state/ssh-history.log

              push_state || true

            fi


            # ======================================================
            # WAIT FOR TUNNEL
            # ======================================================
            wait "${PID}" || true

            echo
            echo "[$(date -u)] Tunnel ended." \
              | tee -a state/ssh-history.log

            push_state || true


            # ======================================================
            # RESTART
            # ======================================================
            if [ "$(date +%s)" -lt "${END}" ]; then

              echo
              echo "Restarting tunnel in 5 seconds..."
              echo

              sleep 5

            fi

          done


          # ==========================================================
          # END
          # ==========================================================
          echo
          echo "[$(date -u)] Tunnel lifetime ended." \
            | tee -a state/ssh-history.log

          push_state || true


      # ============================================================
      # RETRIGGER SAME WORKFLOW
      # ============================================================
      - name: Retrigger same workflow
        if: ${{ success() || failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE=".github/workflows/ssh-tunnel-host.yml"

          echo
          echo "========================================"
          echo "RETRIGGER WORKFLOW"
          echo "========================================"

          echo "Workflow file:"
          echo "${WORKFLOW_FILE}"

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"

          echo
          echo "Workflow retriggered successfully."
