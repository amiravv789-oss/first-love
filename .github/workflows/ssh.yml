name: SSH Tunnel Host

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          lfs: true

      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client git-lfs
          git lfs install
          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config || true
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          echo "root:tunnelpass" | sudo chpasswd
          sudo service ssh restart || sudo /usr/sbin/sshd

      - name: Prepare
        run: |
          mkdir -p state
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Tunnel loop (push link immediately)
        run: |
          echo "=== Start $(date) ===" >> state/ssh-history.log
          END=$(($(date +%s) + 340*60))

          while [ $(date +%s) -lt $END ]; do
            echo "[$(date)] Starting tunnel..." | tee -a state/ssh-history.log
            > tunnel-out.log

            timeout 55m ssh -p 443 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ConnectTimeout=30 \
              -R0:localhost:22 \
              qr@free.pinggy.io > tunnel-out.log 2>&1 &

            PID=$!

            # صبر برای لینک (حداکثر ۶۰ ثانیه)
            LINK=""
            for i in $(seq 1 20); do
              sleep 3
              LINK=$(grep -oE 'tcp://[a-zA-Z0-9.-]+\.[a-zA-Z0-9.-]+:[0-9]+' tunnel-out.log | head -1 || true)
              if [ -n "$LINK" ]; then
                break
              fi
            done

            echo "=== tunnel-out.log ===" | tee -a state/ssh-history.log
            cat tunnel-out.log | tee -a state/ssh-history.log
            echo "=== end ===" | tee -a state/ssh-history.log

            if [ -n "$LINK" ]; then
              echo "$LINK" > state/last-link.txt
              echo "[$(date)] LIVE LINK: $LINK" | tee -a state/ssh-history.log

              cat > state/index.html << HTMLEOF
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="20">
<title>SSH Link</title>
<style>
body{font-family:sans-serif;text-align:center;padding:40px;background:#111;color:#0f0}
.link{font-size:1.6rem;word-break:break-all;background:#222;padding:20px;border-radius:8px;margin:20px}
</style>
</head>
<body>
<h1>Current SSH Tunnel</h1>
<div class="link">$LINK</div>
<p>Updated: $(date -u)</p>
</body>
</html>
HTMLEOF

              # === فوری پوش لینک ===
              git add state/last-link.txt state/index.html state/ssh-history.log
              git commit -m "live: $LINK" || true
              git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true
              echo "Link pushed immediately!"
            else
              echo "[$(date)] No link received" | tee -a state/ssh-history.log
            fi

            wait $PID || true
            echo "[$(date)] Tunnel ended, restart in 8s..." | tee -a state/ssh-history.log
            sleep 8
          done

          echo "=== End $(date) ===" >> state/ssh-history.log

      - name: Final push
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: final sync [skip ci]"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true

      - name: Retrigger
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "host.yml",
                ref: context.ref
              });
            } catch (e) {
              console.log(e.message);
            }
