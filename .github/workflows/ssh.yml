name: Ubuntu Desktop Remote

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write
      actions: write

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          lfs: true

      # ==================================================
      # INSTALL UBUNTU DESKTOP + XRDP + TOOLS
      # ==================================================

      - name: Install Ubuntu Desktop
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "Updating APT"
          echo "======================================"

          sudo apt-get update -qq

          echo "======================================"
          echo "Installing Ubuntu Desktop"
          echo "======================================"

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ubuntu-desktop \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            openssh-server \
            openssh-client \
            git-lfs \
            curl \
            wget \
            ca-certificates \
            gnupg \
            python3 \
            python3-pip \
            python3-venv \
            python-is-python3 \
            unzip \
            software-properties-common

          echo "======================================"
          echo "Ubuntu Desktop installed"
          echo "======================================"

          # ==================================================
          # GIT LFS
          # ==================================================

          git lfs install

          # ==================================================
          # ROOT PASSWORD
          # ==================================================

          echo "root:${SSH_PASSWORD}" | sudo chpasswd

          # ==================================================
          # SSH
          # ==================================================

          sudo mkdir -p /var/run/sshd

          sudo ssh-keygen -A

          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?UsePAM .*/UsePAM yes/' \
            /etc/ssh/sshd_config

          grep -q '^PermitRootLogin' /etc/ssh/sshd_config || \
            echo 'PermitRootLogin yes' | sudo tee -a /etc/ssh/sshd_config

          grep -q '^PasswordAuthentication' /etc/ssh/sshd_config || \
            echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config

          # GitHub Actions runners may have this PAM module configured
          # in a way that interferes with root SSH sessions.

          if [ -f /etc/pam.d/sshd ]; then
            sudo sed -i \
              's/^\(session[[:space:]]\+required[[:space:]]\+pam_loginuid.so\)/#\1/' \
              /etc/pam.d/sshd || true
          fi

          # ==================================================
          # XRDP
          # ==================================================

          echo "======================================"
          echo "Configuring XRDP"
          echo "======================================"

          # Enable root XRDP login
          sudo sed -i \
            's/^[#;]*[[:space:]]*AllowRootLogin=.*/AllowRootLogin=true/' \
            /etc/xrdp/sesman.ini

          # If AllowRootLogin does not exist, add it.
          if ! sudo grep -Eq '^[[:space:]]*AllowRootLogin=' /etc/xrdp/sesman.ini; then
            sudo sed -i \
              '/^\[Security\]/a AllowRootLogin=true' \
              /etc/xrdp/sesman.ini
          fi

          # Do not require a special terminal-server group.
          if sudo grep -Eq '^[[:space:]]*AlwaysGroupCheck=' /etc/xrdp/sesman.ini; then
            sudo sed -i \
              's/^[[:space:]]*AlwaysGroupCheck=.*/AlwaysGroupCheck=false/' \
              /etc/xrdp/sesman.ini
          else
            sudo sed -i \
              '/^\[Security\]/a AlwaysGroupCheck=false' \
              /etc/xrdp/sesman.ini
          fi

          # ==================================================
          # FORCE GNOME TO USE XORG
          # ==================================================

          echo "======================================"
          echo "Configuring GNOME / Xorg"
          echo "======================================"

          sudo mkdir -p /etc/gdm3

          if [ -f /etc/gdm3/custom.conf ]; then
            sudo cp \
              /etc/gdm3/custom.conf \
              /etc/gdm3/custom.conf.backup
          fi

          if sudo grep -q '^\[daemon\]' /etc/gdm3/custom.conf; then

            if sudo grep -q '^WaylandEnable=' /etc/gdm3/custom.conf; then
              sudo sed -i \
                's/^WaylandEnable=.*/WaylandEnable=false/' \
                /etc/gdm3/custom.conf
            else
              sudo sed -i \
                '/^\[daemon\]/a WaylandEnable=false' \
                /etc/gdm3/custom.conf
            fi

          else

            sudo tee /etc/gdm3/custom.conf > /dev/null <<'EOF'
          [daemon]
          WaylandEnable=false
          EOF

          fi

          # ==================================================
          # GNOME XRDP SESSION
          # ==================================================

          sudo tee /root/.xsession > /dev/null <<'EOF'
          export GNOME_SHELL_SESSION_MODE=ubuntu
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          export XDG_SESSION_DESKTOP=ubuntu
          export XDG_SESSION_TYPE=x11
          export DESKTOP_SESSION=ubuntu
          export GDK_BACKEND=x11

          exec dbus-run-session -- gnome-session --session=ubuntu
          EOF

          sudo chmod 644 /root/.xsession

          # ==================================================
          # XRDP STARTWM
          # ==================================================

          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/etc/xdg/xdg-ubuntu:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/ubuntu:/usr/share/gnome:/usr/local/share:/usr/share

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          if [ -r "$HOME/.xsession" ]; then
              . "$HOME/.xsession"
          else
              exec dbus-run-session -- gnome-session --session=ubuntu
          fi
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # ==================================================
          # CHROME
          # ==================================================

          echo "======================================"
          echo "Installing Google Chrome"
          echo "======================================"

          wget -q \
            -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y -qq \
            /tmp/google-chrome.deb

          rm -f /tmp/google-chrome.deb

          google-chrome --version

          # ==================================================
          # VS CODE
          # ==================================================

          echo "======================================"
          echo "Installing Visual Studio Code"
          echo "======================================"

          wget -qO- \
            https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/microsoft.gpg > /dev/null

          sudo chmod 644 \
            /usr/share/keyrings/microsoft.gpg

          sudo tee /etc/apt/sources.list.d/vscode.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Architectures: amd64,arm64,armhf
          Signed-By: /usr/share/keyrings/microsoft.gpg
          EOF

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq code

          code --version

          # ==================================================
          # PYTHON
          # ==================================================

          echo "======================================"
          echo "Python"
          echo "======================================"

          python3 --version
          python --version
          pip3 --version

          python3 -m pip install \
            --break-system-packages \
            -q \
            pexpect

          # ==================================================
          # NODE.JS LTS FOR ROOT
          # ==================================================

          echo "======================================"
          echo "Installing Node.js LTS for root"
          echo "======================================"

          sudo rm -rf /root/.nvm

          sudo mkdir -p /root/.nvm

          sudo chown -R root:root /root/.nvm

          sudo env \
            HOME=/root \
            NVM_DIR=/root/.nvm \
            bash -c '
              set -e

              curl -fsSL \
                https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh \
                | bash

              export NVM_DIR="/root/.nvm"

              source "$NVM_DIR/nvm.sh"

              nvm install --lts

              nvm alias default "lts/*"

              nvm use --lts

              echo "Node: $(node --version)"
              echo "NPM:  $(npm --version)"
              echo "NPX:  $(npx --version)"
            '

          # ==================================================
          # ROOT BASHRC
          # ==================================================

          sudo tee -a /root/.bashrc > /dev/null <<'EOF'

          export NVM_DIR="/root/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
          fi

          if command -v nvm >/dev/null 2>&1; then
              nvm use --silent --lts >/dev/null 2>&1 || true
          fi
          EOF

          # ==================================================
          # CREATE DESKTOP
          # SHORTCUTS
          # ==================================================

          echo "======================================"
          echo "Creating Desktop shortcuts"
          echo "======================================"

          sudo mkdir -p /root/Desktop

          # Chrome desktop shortcut
          sudo cp \
            /usr/share/applications/google-chrome.desktop \
            /root/Desktop/google-chrome.desktop

          # VS Code desktop shortcut
          sudo cp \
            /usr/share/applications/code.desktop \
            /root/Desktop/code.desktop

          sudo chmod +x \
            /root/Desktop/google-chrome.desktop \
            /root/Desktop/code.desktop

          # Allow GNOME to trust the desktop files
          sudo -H -u root dbus-run-session \
            gio set \
            /root/Desktop/google-chrome.desktop \
            metadata::trusted true || true

          sudo -H -u root dbus-run-session \
            gio set \
            /root/Desktop/code.desktop \
            metadata::trusted true || true

          # ==================================================
          # PIN CHROME + VS CODE TO GNOME DOCK
          # ==================================================

          echo "======================================"
          echo "Pinning applications to GNOME Dock"
          echo "======================================"

          sudo -H -u root dbus-run-session \
            gsettings set \
            org.gnome.shell \
            favorite-apps \
            "[
              'org.gnome.Nautilus.desktop',
              'google-chrome.desktop',
              'code.desktop'
            ]" || true

          # ==================================================
          # VERIFY APPLICATIONS
          # ==================================================

          echo
          echo "======================================"
          echo "APPLICATION CHECK"
          echo "======================================"

          echo "Chrome:"
          google-chrome --version

          echo
          echo "VS Code:"
          code --version

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Node.js:"
          sudo -H -u root bash -lc '
            export NVM_DIR="/root/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use --lts
            node --version
            npm --version
          '

          # ==================================================
          # XRDP / SSH START
          # ==================================================

          echo
          echo "======================================"
          echo "Starting SSH + XRDP"
          echo "======================================"

          sudo systemctl enable xrdp || true
          sudo systemctl restart xrdp || true

          sudo systemctl restart ssh || true

          if ! pgrep -x sshd >/dev/null; then
            sudo /usr/sbin/sshd
          fi

          # ==================================================
          # DIAGNOSTICS
          # ==================================================

          echo
          echo "======================================"
          echo "PORTS"
          echo "======================================"

          sudo ss -lntp | grep ':22' || true

          sudo ss -lntp | grep ':3389' || true

          echo
          echo "======================================"
          echo "XRDP STATUS"
          echo "======================================"

          sudo systemctl --no-pager status xrdp || true

          echo
          echo "======================================"
          echo "DESKTOP"
          echo "======================================"

          echo "Ubuntu Desktop installed."
          echo "GNOME session configured."
          echo "Chrome installed."
          echo "VS Code installed."
          echo "Chrome + VS Code pinned to GNOME Dock."

      # ==================================================
      # PREPARE
      # ==================================================

      - name: Prepare
        run: |
          set -e

          mkdir -p state

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # ==================================================
      # WRITE TUNNEL.PY
      # ==================================================

      - name: Write tunnel.py
        run: |
          cat > tunnel.py << 'PY'
          #!/usr/bin/env python3

          import pexpect
          import re
          import time
          import subprocess
          import os
          from datetime import datetime


          END = time.time() + (340 * 60)

          LOG = "state/ssh-history.log"


          def log(message):

              line = (
                  f"[{datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')} UTC] "
                  f"{message}"
              )

              print(line, flush=True)

              with open(LOG, "a") as f:
                  f.write(line + "\n")


          def git_push(link):

              link = link.replace("tcp://", "")

              host, port = link.rsplit(":", 1)

              # ==================================================
              # CREATE CLIENT.SH
              # ==================================================

              with open("client.sh", "w") as f:

                  f.write("#!/bin/bash\n")
                  f.write("set -e\n\n")

                  f.write(f'HOST="{host}"\n')
                  f.write(f'PORT="{port}"\n\n')

                  f.write('MODE="${1:-ssh}"\n\n')

                  # ==================================================
                  # SSH MODE
                  # ==================================================

                  f.write('if [ "$MODE" = "ssh" ]; then\n')

                  f.write(
                      '    exec ssh '
                      '-o StrictHostKeyChecking=no '
                      '-o UserKnownHostsFile=/dev/null '
                      '-o ServerAliveInterval=30 '
                      '-o ServerAliveCountMax=3 '
                      '-p "$PORT" '
                      'root@"$HOST"\n'
                  )

                  f.write("fi\n\n")

                  # ==================================================
                  # RDP MODE
                  # ==================================================

                  f.write('if [ "$MODE" = "rdp" ]; then\n')

                  f.write(
                      '    ssh '
                      '-o StrictHostKeyChecking=no '
                      '-o UserKnownHostsFile=/dev/null '
                      '-o ServerAliveInterval=30 '
                      '-o ServerAliveCountMax=3 '
                      '-N '
                      '-L 3389:127.0.0.1:3389 '
                      '-p "$PORT" '
                      'root@"$HOST" &\n'
                  )

                  f.write("    TUNNEL_PID=$!\n\n")

                  f.write(
                      '    trap "kill $TUNNEL_PID 2>/dev/null || true" EXIT\n'
                  )

                  f.write("    sleep 2\n\n")

                  # ==================================================
                  # WINDOWS
                  # ==================================================

                  f.write(
                      '    if command -v mstsc.exe >/dev/null 2>&1; then\n'
                  )

                  f.write(
                      '        mstsc.exe /v:127.0.0.1:3389\n'
                  )

                  # Keep SSH forwarding alive.
                  f.write("        wait $TUNNEL_PID || true\n")

                  f.write("        exit 0\n")
                  f.write("    fi\n\n")

                  # ==================================================
                  # LINUX
                  # ==================================================

                  f.write(
                      '    if command -v xfreerdp >/dev/null 2>&1; then\n'
                  )

                  f.write(
                      '        xfreerdp '
                      '/v:127.0.0.1:3389 '
                      '/u:root\n'
                  )

                  f.write("        exit 0\n")
                  f.write("    fi\n\n")

                  # ==================================================
                  # MACOS
                  # ==================================================

                  f.write(
                      '    if command -v open >/dev/null 2>&1; then\n'
                  )

                  f.write(
                      '        open '
                      '"rdp://full%20address=s:127.0.0.1:3389"\n'
                  )

                  f.write("        wait $TUNNEL_PID || true\n")

                  f.write("        exit 0\n")
                  f.write("    fi\n\n")

                  f.write(
                      '    echo "No RDP client found."\n'
                  )

                  f.write("    exit 1\n")

                  f.write("fi\n\n")

                  f.write("exit 1\n")

              os.chmod(
                  "client.sh",
                  0o755
              )

              # ==================================================
              # COMMIT
              # ==================================================

              subprocess.run(
                  [
                      "git",
                      "add",
                      "client.sh",
                      LOG
                  ],
                  check=False
              )

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"live tunnel: {link}"
                  ],
                  check=False
              )

              # ==================================================
              # PUSH
              # ==================================================

              token = os.environ.get(
                  "GH_TOKEN",
                  ""
              )

              repo = os.environ.get(
                  "GITHUB_REPOSITORY",
                  ""
              )

              if token and repo:

                  url = (
                      f"https://x-access-token:{token}"
                      f"@github.com/{repo}.git"
                  )

                  subprocess.run(
                      [
                          "git",
                          "push",
                          url,
                          "HEAD:main"
                      ],
                      check=False
                  )

              log(
                  f"client.sh pushed: {link}"
              )


          # ==================================================
          # MAIN TUNNEL LOOP
          # ==================================================

          log(
              "=== Tunnel service started ==="
          )


          while time.time() < END:

              log(
                  "Starting Pinggy tunnel..."
              )

              try:

                  child = pexpect.spawn(
                      "ssh "
                      "-p 443 "
                      "-o StrictHostKeyChecking=no "
                      "-o UserKnownHostsFile=/dev/null "
                      "-o ServerAliveInterval=30 "
                      "-o ServerAliveCountMax=3 "
                      "-o ConnectTimeout=30 "
                      "-R0:localhost:22 "
                      "tcp@free.pinggy.io",
                      timeout=60,
                      encoding="utf-8"
                  )

                  logfile = open(
                      "tunnel-out.log",
                      "w"
                  )

                  child.logfile_read = logfile

                  # ==================================================
                  # PINGGY PROMPTS
                  # ==================================================

                  try:

                      idx = child.expect(
                          [
                              r"(?i)password:",
                              r"(?i)yes/no",
                              pexpect.EOF,
                              pexpect.TIMEOUT
                          ],
                          timeout=30
                      )

                      if idx == 0:
                          child.sendline("")

                      elif idx == 1:
                          child.sendline("yes")

                  except Exception as e:

                      log(
                          f"Initial connection handling: {e}"
                      )

                  # ==================================================
                  # FIND PINGGY URL
                  # ==================================================

                  link = None

                  for _ in range(40):

                      time.sleep(1.5)

                      try:

                          with open(
                              "tunnel-out.log",
                              "r"
                          ) as f:

                              output = f.read()

                      except Exception:

                          output = ""

                      match = re.search(
                          r'tcp://[a-zA-Z0-9.-]+:[0-9]+',
                          output
                      )

                      if match:

                          link = match.group(0)

                          break

                      if not child.isalive():

                          break

                  # ==================================================
                  # TUNNEL FOUND
                  # ==================================================

                  if link:

                      log(
                          f"LIVE: {link}"
                      )

                      git_push(link)

                  else:

                      log(
                          "Pinggy tunnel URL was not found."
                      )

                      try:

                          with open(
                              "tunnel-out.log",
                              "r"
                          ) as f:

                              print(
                                  f.read()
                              )

                      except Exception:
                          pass

                  # ==================================================
                  # KEEP TUNNEL ALIVE
                  # ==================================================

                  try:

                      child.expect(
                          pexpect.EOF,
                          timeout=3300
                      )

                  except pexpect.TIMEOUT:

                      log(
                          "55 minute timeout. Restarting..."
                      )

                      child.terminate(
                          force=True
                      )

                  except Exception as e:

                      log(
                          f"Tunnel ended: {e}"
                      )

                  try:
                      logfile.close()
                  except Exception:
                      pass

              except Exception as e:

                  log(
                      f"Tunnel error: {e}"
                  )

              log(
                  "Restarting tunnel in 8 seconds..."
              )

              time.sleep(8)


          log(
              "=== Tunnel service ended ==="
          )

          PY

          chmod +x tunnel.py

      # ==================================================
      # RUN TUNNEL
      # ==================================================

      - name: Run tunnel
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tunnel.py

      # ==================================================
      # FINAL PUSH
      # ==================================================

      - name: Final push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A

          git diff --cached --quiet || \
            git commit \
              -m "chore: final sync [skip ci]"

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:main || true

      # ==================================================
      # RETRIGGER
      # ==================================================

      - name: Retrigger
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ssh.yml",
                ref: context.ref
              });
            } catch (e) {
              console.log(e.message);
            }
