name: SSH Tunnel Host

on:
  workflow_dispatch:

concurrency:
  group: ssh-tunnel-host
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write
      actions: write

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          lfs: true


      # ------------------------------------------------------------
      # SETUP SSH SERVER
      # ------------------------------------------------------------
      - name: Setup SSH server
        shell: bash
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            openssh-server \
            openssh-client \
            git-lfs \
            curl

          git lfs install

          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A

          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          echo "root:tunnelpass" | sudo chpasswd

          sudo service ssh restart || sudo /usr/sbin/sshd

          echo "SSH server is ready."


      # ------------------------------------------------------------
      # PREPARE STATE
      # ------------------------------------------------------------
      - name: Prepare state
        shell: bash
        run: |
          set -e

          mkdir -p state

          touch state/ssh-history.log
          touch state/last-link.txt
          touch client.ssh


      # ------------------------------------------------------------
      # TUNNEL
      # ------------------------------------------------------------
      - name: Start TCP tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -u

          END=$(($(date +%s) + 340*60))

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo "========================================"
          echo "SSH TCP TUNNEL START"
          echo "========================================"

          echo "[$(date -u)] Tunnel started" \
            | tee -a state/ssh-history.log


          # ----------------------------------------------------------
          # PUSH STATE
          # ----------------------------------------------------------
          push_state() {

            echo
            echo "========== PUSH STATE =========="

            for ATTEMPT in 1 2 3 4 5; do

              echo "Push attempt: ${ATTEMPT}"

              # Get newest remote state
              git fetch origin main || true

              # Make local branch exactly follow remote
              git reset --mixed origin/main || true

              # Add only generated files
              git add \
                client.ssh \
                state/

              # Nothing changed
              if git diff --cached --quiet; then
                echo "Nothing to push."
                return 0
              fi

              git commit \
                -m "chore: update SSH tunnel [skip ci]" \
                || true

              if git push "${REPO_URL}" HEAD:main; then
                echo "State pushed successfully."
                return 0
              fi

              echo "Push rejected. Remote changed."
              echo "Waiting before retry..."

              sleep $((ATTEMPT * 2))

            done

            echo "WARNING: Could not push state."
            return 1
          }


          # ----------------------------------------------------------
          # GENERATE CLIENT.SSH
          # ----------------------------------------------------------
          create_client() {

            LINK="$1"

            # Remove tcp://
            ADDRESS="${LINK#tcp://}"

            HOST="${ADDRESS%:*}"
            PORT="${ADDRESS##*:}"

            echo
            echo "========================================"
            echo "NEW TCP TUNNEL"
            echo "HOST: ${HOST}"
            echo "PORT: ${PORT}"
            echo "========================================"


            # Save raw TCP address
            printf '%s\n' "${LINK}" > state/last-link.txt


            # --------------------------------------------------------
            # CLIENT SCRIPT
            # --------------------------------------------------------
            cat > client.ssh <<EOF
#!/usr/bin/env bash

set -e

HOST="${HOST}"
PORT="${PORT}"
USER="root"

echo
echo "========================================"
echo " GitHub Actions SSH Tunnel"
echo "========================================"
echo
echo "Host : \$HOST"
echo "Port : \$PORT"
echo
echo "Connecting..."
echo

exec ssh \
  -o StrictHostKeyChecking=no \
  -o UserKnownHostsFile=/dev/null \
  -o ServerAliveInterval=30 \
  -o ServerAliveCountMax=3 \
  -o ConnectTimeout=30 \
  -p "\$PORT" \
  "\$USER@\$HOST"
EOF

            chmod +x client.ssh


            # --------------------------------------------------------
            # HTML STATUS PAGE
            # --------------------------------------------------------
            cat > state/index.html <<EOF
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>SSH Tunnel</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px;
    background: #111;
    color: #0f0;
}

.box {
    max-width: 900px;
    margin: auto;
}

.link {
    font-size: 1.5rem;
    word-break: break-all;
    background: #222;
    padding: 20px;
    border-radius: 8px;
}

.command {
    margin-top: 25px;
    background: #222;
    color: #fff;
    padding: 20px;
    border-radius: 8px;
    word-break: break-all;
    text-align: left;
}

small {
    color: #888;
}
</style>
</head>

<body>

<div class="box">

<h1>Current SSH Tunnel</h1>

<div class="link">
${LINK}
</div>

<div class="command">
curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/client.ssh | bash
</div>

<p>
Updated: $(date -u)
</p>

<small>
GitHub Actions SSH Tunnel
</small>

</div>

</body>
</html>
EOF


            # --------------------------------------------------------
            # PUSH IMMEDIATELY
            # --------------------------------------------------------
            echo
            echo "Uploading new client.ssh immediately..."

            push_state || true
          }


          # ----------------------------------------------------------
          # MAIN TUNNEL LOOP
          # ----------------------------------------------------------
          while [ "$(date +%s)" -lt "$END" ]; do

            echo
            echo "========================================"
            echo "Starting new Pinggy TCP tunnel..."
            echo "========================================"

            echo "[$(date -u)] New tunnel..." \
              | tee -a state/ssh-history.log

            rm -f tunnel-out.log


            # --------------------------------------------------------
            # IMPORTANT:
            # tcp@free.pinggy.io
            # NOT qr@free.pinggy.io
            # --------------------------------------------------------
            timeout 55m ssh \
              -p 443 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=30 \
              -R0:localhost:22 \
              tcp@free.pinggy.io \
              > tunnel-out.log 2>&1 &

            PID=$!

            echo "Pinggy PID: ${PID}"


            # --------------------------------------------------------
            # WAIT FOR TCP ADDRESS
            # --------------------------------------------------------
            LINK=""

            for i in $(seq 1 90); do

              sleep 1

              if [ -f tunnel-out.log ]; then

                LINK=$(
                  grep -oE \
                    'tcp://[^[:space:]]+' \
                    tunnel-out.log \
                    | head -1 \
                    || true
                )

              fi

              if [ -n "$LINK" ]; then
                break
              fi

              # If process died before producing a link
              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

            done


            # --------------------------------------------------------
            # LINK FOUND
            # --------------------------------------------------------
            if [ -n "$LINK" ]; then

              echo
              echo "########################################"
              echo "TCP LINK FOUND"
              echo "${LINK}"
              echo "########################################"
              echo

              echo "[$(date -u)] ${LINK}" \
                | tee -a state/ssh-history.log


              # Create/update client.ssh
              create_client "$LINK"


              echo
              echo "client.ssh updated and pushed."
              echo


            else

              echo
              echo "========================================"
              echo "NO TCP LINK FOUND"
              echo "========================================"

              echo
              echo "Pinggy output:"
              echo "----------------------------------------"

              cat tunnel-out.log || true

              echo "----------------------------------------"

              echo "[$(date -u)] No TCP link found." \
                | tee -a state/ssh-history.log

              push_state || true

            fi


            # --------------------------------------------------------
            # WAIT FOR TUNNEL TO END
            # --------------------------------------------------------
            wait "$PID" || true

            echo
            echo "[$(date -u)] Tunnel ended." \
              | tee -a state/ssh-history.log

            push_state || true

            echo "Restarting tunnel in 5 seconds..."

            sleep 5

          done


          # ----------------------------------------------------------
          # END
          # ----------------------------------------------------------
          echo
          echo "[$(date -u)] Tunnel lifetime ended." \
            | tee -a state/ssh-history.log

          push_state || true


      # ------------------------------------------------------------
      # FIND WORKFLOW ID + RETRIGGER
      # ------------------------------------------------------------
      - name: Retrigger same workflow
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e

          echo "Finding current workflow..."

          WORKFLOW_ID=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows" \
            | python3 -c '
          import json
          import os
          import sys

          data = json.load(sys.stdin)

          current_name = os.environ.get(
              "GITHUB_WORKFLOW",
              ""
          ).strip()

          for workflow in data.get("workflows", []):

              if workflow.get("name") == current_name:
                  print(workflow["id"])
                  sys.exit(0)

          print(
              "Current workflow was not found.",
              file=sys.stderr
          )

          sys.exit(1)
          '
          )

          echo "Workflow:"
          echo "${GITHUB_WORKFLOW}"

          echo "Workflow ID:"
          echo "${WORKFLOW_ID}"


          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"

          echo
          echo "Workflow retriggered."
