name: Ubuntu Desktop Remote

on:
  workflow_dispatch:

concurrency:
  group: ssh-runner
  cancel-in-progress: false
  
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write
      actions: write

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          lfs: true

      # ==================================================
      # INSTALL UBUNTU DESKTOP
      # ==================================================

      - name: Install Ubuntu Desktop
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e

          export TERM=xterm-256color

          echo "======================================"
          echo "Updating APT"
          echo "======================================"

          sudo apt-get update -qq

          echo "======================================"
          echo "Installing Ubuntu Desktop"
          echo "======================================"

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ubuntu-desktop \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            openssh-server \
            openssh-client \
            git-lfs \
            curl \
            wget \
            ca-certificates \
            gnupg \
            python3 \
            python3-pip \
            python3-venv \
            python-is-python3 \
            unzip \
            software-properties-common \
            desktop-file-utils \
            xdg-utils

          git lfs install

          # ==================================================
          # ROOT PASSWORD
          # ==================================================

          echo "root:${SSH_PASSWORD}" | sudo chpasswd

          # ==================================================
          # SSH
          # ==================================================

          sudo mkdir -p /var/run/sshd

          sudo ssh-keygen -A

          sudo sed -i \
            's/^#\?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?UsePAM .*/UsePAM yes/' \
            /etc/ssh/sshd_config

          grep -q '^PermitRootLogin' /etc/ssh/sshd_config || \
            echo 'PermitRootLogin yes' | sudo tee -a /etc/ssh/sshd_config

          grep -q '^PasswordAuthentication' /etc/ssh/sshd_config || \
            echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config

          # ==================================================
          # XRDP
          # ==================================================

          echo "======================================"
          echo "Configuring XRDP"
          echo "======================================"

          sudo sed -i \
            's/^[#;]*[[:space:]]*AllowRootLogin=.*/AllowRootLogin=true/' \
            /etc/xrdp/sesman.ini

          if ! sudo grep -Eq '^[[:space:]]*AllowRootLogin=' /etc/xrdp/sesman.ini; then
            sudo sed -i \
              '/^\[Security\]/a AllowRootLogin=true' \
              /etc/xrdp/sesman.ini
          fi

          sudo sed -i \
            's/^[#;]*[[:space:]]*AlwaysGroupCheck=.*/AlwaysGroupCheck=false/' \
            /etc/xrdp/sesman.ini

          if ! sudo grep -Eq '^[[:space:]]*AlwaysGroupCheck=' /etc/xrdp/sesman.ini; then
            sudo sed -i \
              '/^\[Security\]/a AlwaysGroupCheck=false' \
              /etc/xrdp/sesman.ini
          fi

          # ==================================================
          # GNOME / XORG
          # ==================================================

          echo "======================================"
          echo "Configuring GNOME / Xorg"
          echo "======================================"

          sudo mkdir -p /etc/gdm3

          if [ -f /etc/gdm3/custom.conf ]; then
            sudo cp \
              /etc/gdm3/custom.conf \
              /etc/gdm3/custom.conf.backup
          fi

          if sudo grep -q '^\[daemon\]' /etc/gdm3/custom.conf; then

            if sudo grep -q '^WaylandEnable=' /etc/gdm3/custom.conf; then
              sudo sed -i \
                's/^WaylandEnable=.*/WaylandEnable=false/' \
                /etc/gdm3/custom.conf
            else
              sudo sed -i \
                '/^\[daemon\]/a WaylandEnable=false' \
                /etc/gdm3/custom.conf
            fi

          else

            sudo tee /etc/gdm3/custom.conf > /dev/null <<'EOF'
          [daemon]
          WaylandEnable=false
          EOF

          fi

          # ==================================================
          # ROOT GNOME SESSION
          # ==================================================

          sudo tee /root/.xsession > /dev/null <<'EOF'
          export GNOME_SHELL_SESSION_MODE=ubuntu
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          export XDG_SESSION_DESKTOP=ubuntu
          export XDG_SESSION_TYPE=x11
          export DESKTOP_SESSION=ubuntu
          export GDK_BACKEND=x11

          exec dbus-run-session -- gnome-session --session=ubuntu
          EOF

          sudo chmod 644 /root/.xsession

          # ==================================================
          # XRDP STARTWM
          # ==================================================

          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/etc/xdg:/etc/xdg/xdg-gnome
          export XDG_DATA_DIRS=/usr/share/ubuntu:/usr/share/gnome:/usr/local/share:/usr/share

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          if [ -r "$HOME/.xsession" ]; then
              . "$HOME/.xsession"
          else
              exec dbus-run-session -- gnome-session --session=ubuntu
          fi
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # ==================================================
          # GOOGLE CHROME
          # ==================================================

          echo "======================================"
          echo "Installing Google Chrome"
          echo "======================================"

          wget -q \
            -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y -qq \
            /tmp/google-chrome.deb

          rm -f /tmp/google-chrome.deb

          echo "Chrome:"
          google-chrome --version

          # ==================================================
          # VISUAL STUDIO CODE
          # ==================================================

          echo "======================================"
          echo "Installing Visual Studio Code"
          echo "======================================"

          wget -qO- \
            https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/microsoft.gpg > /dev/null

          sudo chmod 644 \
            /usr/share/keyrings/microsoft.gpg

          sudo tee /etc/apt/sources.list.d/vscode.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Architectures: amd64,arm64,armhf
          Signed-By: /usr/share/keyrings/microsoft.gpg
          EOF

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq code

          echo "VS Code:"
          code --version

          # ==================================================
          # PYTHON
          # ==================================================

          echo "======================================"
          echo "Python"
          echo "======================================"

          python3 --version
          python --version
          pip3 --version

          python3 -m pip install \
            --break-system-packages \
            -q \
            pexpect

          # ==================================================
          # NODE.JS LTS
          # ==================================================

          echo "======================================"
          echo "Installing Node.js LTS"
          echo "======================================"

          sudo rm -rf /root/.nvm

          sudo mkdir -p /root/.nvm

          sudo chown -R root:root /root/.nvm

          sudo env \
            HOME=/root \
            NVM_DIR=/root/.nvm \
            TERM=xterm-256color \
            bash -c '
              set -e

              curl -fsSL \
                https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh \
                | bash

              export NVM_DIR="/root/.nvm"

              source "$NVM_DIR/nvm.sh"

              nvm install --lts

              nvm alias default "lts/*"

              nvm use --lts

              echo "Node: $(node --version)"
              echo "NPM:  $(npm --version)"
              echo "NPX:  $(npx --version)"
            '

          # ==================================================
          # ROOT BASHRC
          # ==================================================

          sudo tee -a /root/.bashrc > /dev/null <<'EOF'

          export NVM_DIR="/root/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
          fi

          if command -v nvm >/dev/null 2>&1; then
              nvm use --silent --lts >/dev/null 2>&1 || true
          fi
          EOF

          # ==================================================
          # FIND DESKTOP FILES
          # ==================================================

          echo "======================================"
          echo "Finding Desktop Entries"
          echo "======================================"

          CHROME_DESKTOP=""

          for f in \
            /usr/share/applications/google-chrome.desktop \
            /usr/share/applications/google-chrome-stable.desktop \
            /usr/local/share/applications/google-chrome.desktop \
            /root/.local/share/applications/google-chrome.desktop
          do
            if [ -f "$f" ]; then
              CHROME_DESKTOP="$f"
              break
            fi
          done

          if [ -z "$CHROME_DESKTOP" ]; then
            CHROME_DESKTOP="$(
              find \
                /usr/share/applications \
                /usr/local/share/applications \
                -type f \
                \( \
                  -iname '*chrome*.desktop' \
                  -o \
                  -iname '*google*chrome*.desktop' \
                \) \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          CODE_DESKTOP=""

          for f in \
            /usr/share/applications/code.desktop \
            /usr/share/applications/visual-studio-code.desktop \
            /usr/local/share/applications/code.desktop \
            /root/.local/share/applications/code.desktop
          do
            if [ -f "$f" ]; then
              CODE_DESKTOP="$f"
              break
            fi
          done

          if [ -z "$CODE_DESKTOP" ]; then
            CODE_DESKTOP="$(
              find \
                /usr/share/applications \
                /usr/local/share/applications \
                -type f \
                \( \
                  -iname 'code.desktop' \
                  -o \
                  -iname '*visual*studio*code*.desktop' \
                \) \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          echo "Chrome desktop file:"
          echo "${CHROME_DESKTOP:-NOT FOUND}"

          echo "VS Code desktop file:"
          echo "${CODE_DESKTOP:-NOT FOUND}"

          # ==================================================
          # CREATE ROOT DESKTOP
          # ==================================================

          echo "======================================"
          echo "Creating Desktop Shortcuts"
          echo "======================================"

          sudo mkdir -p /root/Desktop

          if [ -n "$CHROME_DESKTOP" ] && [ -f "$CHROME_DESKTOP" ]; then

            sudo cp \
              "$CHROME_DESKTOP" \
              /root/Desktop/google-chrome.desktop

            sudo chmod +x \
              /root/Desktop/google-chrome.desktop

          else

            sudo tee /root/Desktop/google-chrome.desktop > /dev/null <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome-stable %U
          Icon=google-chrome
          Terminal=false
          Categories=Network;WebBrowser;
          EOF

            sudo chmod +x \
              /root/Desktop/google-chrome.desktop

          fi

          if [ -n "$CODE_DESKTOP" ] && [ -f "$CODE_DESKTOP" ]; then

            sudo cp \
              "$CODE_DESKTOP" \
              /root/Desktop/code.desktop

            sudo chmod +x \
              /root/Desktop/code.desktop

          else

            sudo tee /root/Desktop/code.desktop > /dev/null <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Visual Studio Code
          Comment=Code Editing
          Exec=/usr/bin/code --unity-launch %F
          Icon=com.visualstudio.code
          Terminal=false
          Categories=Development;IDE;
          StartupNotify=true
          EOF

            sudo chmod +x \
              /root/Desktop/code.desktop

          fi

          # ==================================================
          # TRUST DESKTOP FILES
          # ==================================================

          sudo -H -u root \
            dbus-run-session \
            gio set \
            /root/Desktop/google-chrome.desktop \
            metadata::trusted true || true

          sudo -H -u root \
            dbus-run-session \
            gio set \
            /root/Desktop/code.desktop \
            metadata::trusted true || true

          # ==================================================
          # GNOME DOCK
          # ==================================================

          echo "======================================"
          echo "Configuring GNOME Dock"
          echo "======================================"

          sudo -H -u root \
            dbus-run-session \
            gsettings set \
            org.gnome.shell \
            favorite-apps \
            "[
              'org.gnome.Nautilus.desktop',
              'google-chrome.desktop',
              'code.desktop',
              'org.gnome.Terminal.desktop'
            ]" || true

          # ==================================================
          # VERIFY APPLICATIONS
          # ==================================================

          echo
          echo "======================================"
          echo "APPLICATION CHECK"
          echo "======================================"

          echo "Chrome:"
          google-chrome --version

          echo
          echo "VS Code:"
          code --version

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Node.js:"

          sudo -H -u root bash -lc '
            export TERM=xterm-256color
            export NVM_DIR="/root/.nvm"

            source "$NVM_DIR/nvm.sh"

            nvm use --lts

            node --version
            npm --version
            npx --version
          '

          # ==================================================
          # START XRDP + SSH
          # ==================================================

          echo
          echo "======================================"
          echo "Starting SSH + XRDP"
          echo "======================================"

          sudo systemctl enable xrdp || true
          sudo systemctl restart xrdp || true

          sudo systemctl restart ssh || true

          if ! pgrep -x sshd >/dev/null; then
            sudo /usr/sbin/sshd
          fi

          # ==================================================
          # PORT CHECK
          # ==================================================

          echo
          echo "======================================"
          echo "PORTS"
          echo "======================================"

          sudo ss -lntp | grep ':22' || true
          sudo ss -lntp | grep ':3389' || true

          # ==================================================
          # XRDP STATUS
          # ==================================================

          echo
          echo "======================================"
          echo "XRDP STATUS"
          echo "======================================"

          sudo systemctl --no-pager status xrdp || true

          echo
          echo "======================================"
          echo "UBUNTU DESKTOP READY"
          echo "======================================"

      # ==================================================
      # PREPARE
      # ==================================================

      - name: Prepare
        run: |
          set -e

          mkdir -p state

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # ==================================================
      # WRITE RUNFLARE TUNNEL.PY
      # ==================================================

      - name: Write tunnel.py
        run: |
          cat > tunnel.py << 'PY'
          #!/usr/bin/env python3

          import os
          import pexpect
          import re
          import subprocess
          import time
          from datetime import datetime


          # ==================================================
          # CONFIGURATION
          # ==================================================

          END = time.time() + (340 * 60)

          LOG = "state/ssh-history.log"

          RUNFLARE_HOST = "remote-respina-free.runflare.com"
          RUNFLARE_PORT = "31212"
          RUNFLARE_USER = "tunnel"

          SSH_PASSWORD = os.environ.get(
              "SSH_PASSWORD",
              ""
          )


          # ==================================================
          # LOG
          # ==================================================

          def log(message):

              line = (
                  f"[{datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')} UTC] "
                  f"{message}"
              )

              print(
                  line,
                  flush=True
              )

              with open(
                  LOG,
                  "a"
              ) as file:

                  file.write(
                      line + "\n"
                  )


          # ==================================================
          # CREATE CLIENT.SH
          # ==================================================

          def create_client(host, port):

              with open(
                  "client.sh",
                  "w"
              ) as file:

                  file.write(
                      "#!/bin/bash\n"
                  )

                  file.write(
                      "set -e\n\n"
                  )

                  file.write(
                      f'HOST="{host}"\n'
                  )

                  file.write(
                      f'PORT="{port}"\n\n'
                  )

                  file.write(
                      'MODE="${1:-ssh}"\n\n'
                  )

                  # ------------------------------------------
                  # SSH
                  # ------------------------------------------

                  file.write(
                      'if [ "$MODE" = "ssh" ]; then\n'
                  )

                  file.write(
                      '    exec ssh '
                      '-o StrictHostKeyChecking=no '
                      '-o UserKnownHostsFile=/dev/null '
                      '-o ServerAliveInterval=30 '
                      '-o ServerAliveCountMax=3 '
                      '-p "$PORT" '
                      'root@"$HOST"\n'
                  )

                  file.write(
                      "fi\n\n"
                  )

                  # ------------------------------------------
                  # RDP
                  # ------------------------------------------

                  file.write(
                      'if [ "$MODE" = "rdp" ]; then\n'
                  )

                  file.write(
                      '    ssh '
                      '-o StrictHostKeyChecking=no '
                      '-o UserKnownHostsFile=/dev/null '
                      '-o ServerAliveInterval=30 '
                      '-o ServerAliveCountMax=3 '
                      '-N '
                      '-L 3389:127.0.0.1:3389 '
                      '-p "$PORT" '
                      'root@"$HOST" &\n'
                  )

                  file.write(
                      '    TUNNEL_PID=$!\n\n'
                  )

                  file.write(
                      '    trap "kill $TUNNEL_PID '
                      '2>/dev/null || true" EXIT\n'
                  )

                  file.write(
                      "    sleep 2\n\n"
                  )

                  # Linux
                  file.write(
                      '    if command -v xfreerdp >/dev/null 2>&1; then\n'
                  )

                  file.write(
                      '        xfreerdp '
                      '/v:127.0.0.1:3389 '
                      '/u:root\n'
                  )

                  file.write(
                      '        exit 0\n'
                  )

                  file.write(
                      '    fi\n\n'
                  )

                  # Windows
                  file.write(
                      '    if command -v mstsc.exe >/dev/null 2>&1; then\n'
                  )

                  file.write(
                      '        mstsc.exe /v:127.0.0.1:3389\n'
                  )

                  file.write(
                      '        wait $TUNNEL_PID || true\n'
                  )

                  file.write(
                      '        exit 0\n'
                  )

                  file.write(
                      '    fi\n\n'
                  )

                  # macOS
                  file.write(
                      '    if command -v open >/dev/null 2>&1; then\n'
                  )

                  file.write(
                      '        open '
                      '"rdp://full%20address=s:127.0.0.1:3389"\n'
                  )

                  file.write(
                      '        wait $TUNNEL_PID || true\n'
                  )

                  file.write(
                      '        exit 0\n'
                  )

                  file.write(
                      '    fi\n\n'
                  )

                  file.write(
                      '    echo "No RDP client found."\n'
                  )

                  file.write(
                      '    exit 1\n'
                  )

                  file.write(
                      "fi\n\n"
                  )

                  file.write(
                      "exit 1\n"
                  )

              os.chmod(
                  "client.sh",
                  0o755
              )


          # ==================================================
          # GIT PUSH
          # ==================================================

          def git_push(host, port):

              create_client(
                  host,
                  port
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      "client.sh",
                      LOG
                  ],
                  check=False
              )

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"live Runflare tunnel: {host}:{port}"
                  ],
                  check=False
              )

              token = os.environ.get(
                  "GH_TOKEN",
                  ""
              )

              repo = os.environ.get(
                  "GITHUB_REPOSITORY",
                  ""
              )

              if token and repo:

                  url = (
                      f"https://x-access-token:{token}"
                      f"@github.com/{repo}.git"
                  )

                  result = subprocess.run(
                      [
                          "git",
                          "push",
                          url,
                          "HEAD:main"
                      ],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode != 0:

                      log(
                          "Git push failed: "
                          + result.stderr[-1000:]
                      )

                  else:

                      log(
                          "client.sh pushed successfully."
                      )

              log(
                  f"client.sh endpoint: {host}:{port}"
              )


          # ==================================================
          # PARSE RUNFLARE OUTPUT
          # ==================================================

          def find_endpoint(output):

              patterns = [

                  # tcp://host:port
                  r'tcp://([A-Za-z0-9.-]+):([0-9]+)',

                  # tcp host:port
                  r'tcp[^\n]*?([A-Za-z0-9.-]+):([0-9]+)',

                  # Forwarding / Tunnel style
                  r'(?:forwarding|tunnel|remote)[^\n]*?'
                  r'([A-Za-z0-9.-]+):([0-9]+)'

              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      output,
                      re.IGNORECASE
                  )

                  if match:

                      host = match.group(1)
                      port = match.group(2)

                      if (
                          host
                          and port
                          and host != RUNFLARE_HOST
                      ):

                          return host, port

              return None


          # ==================================================
          # RUN RUNFLARE
          # ==================================================

          def run_tunnel():

              if not SSH_PASSWORD:

                  log(
                      "ERROR: SSH_PASSWORD secret is empty."
                  )

                  return False

              log(
                  "Starting Runflare reverse SSH tunnel..."
              )

              command = (
                  "ssh "
                  "-p 31212 "
                  "-o StrictHostKeyChecking=no "
                  "-o UserKnownHostsFile=/dev/null "
                  "-o ServerAliveInterval=30 "
                  "-o ServerAliveCountMax=3 "
                  "-o ConnectTimeout=30 "
                  "-N"
                  "-R 2222:localhost:22 "
                  "tunnel@remote-respina-free.runflare.com"
              )

              child = None
              logfile = None

              try:

                  child = pexpect.spawn(
                      command,
                      timeout=60,
                      encoding="utf-8"
                  )

                  logfile = open(
                      "runflare-out.log",
                      "w"
                  )

                  child.logfile_read = logfile

                  endpoint = None

                  # ------------------------------------------
                  # Handle initial SSH interaction
                  # ------------------------------------------

                  for _ in range(30):

                      try:

                          index = child.expect(
                              [
                                  r'(?i)password:',
                                  r'(?i)yes/no',
                                  r'(?i)fingerprint',
                                  r'(?i)tcp://[A-Za-z0-9.-]+:[0-9]+',
                                  pexpect.EOF,
                                  pexpect.TIMEOUT
                              ],
                              timeout=5
                          )

                      except Exception:

                          break

                      if index == 0:

                          child.sendline(
                              SSH_PASSWORD
                          )

                      elif index == 1:

                          child.sendline(
                              "yes"
                          )

                      elif index == 2:

                          child.sendline(
                              "yes"
                          )

                      elif index == 3:

                          try:

                              output = ""

                              with open(
                                  "runflare-out.log",
                                  "r"
                              ) as file:

                                  output = file.read()

                              endpoint = find_endpoint(
                                  output
                              )

                          except Exception:
                              pass

                          if endpoint:
                              break

                      elif index == 4:

                          break

                      else:

                          try:

                              with open(
                                  "runflare-out.log",
                                  "r"
                              ) as file:

                                  output = file.read()

                              endpoint = find_endpoint(
                                  output
                              )

                          except Exception:
                              pass

                          if endpoint:
                              break

                  # ------------------------------------------
                  # Search output again
                  # ------------------------------------------

                  if not endpoint:

                      for _ in range(20):

                          time.sleep(1)

                          try:

                              with open(
                                  "runflare-out.log",
                                  "r"
                              ) as file:

                                  output = file.read()

                              endpoint = find_endpoint(
                                  output
                              )

                          except Exception:

                              output = ""

                          if endpoint:
                              break

                          if not child.isalive():
                              break

                  # ------------------------------------------
                  # Endpoint found
                  # ------------------------------------------

                  if endpoint:

                      host, port = endpoint

                      log(
                          f"RUNFLARE LIVE: {host}:{port}"
                      )

                      git_push(
                          host,
                          port
                      )

                  else:

                      log(
                          "Runflare endpoint was not found."
                      )

                      try:

                          with open(
                              "runflare-out.log",
                              "r"
                          ) as file:

                              output = file.read()

                          print(
                              output,
                              flush=True
                          )

                      except Exception:
                          pass

                  # ------------------------------------------
                  # Keep tunnel alive
                  # ------------------------------------------

                  if child.isalive():

                      remaining = max(
                          1,
                          int(END - time.time())
                      )

                      try:

                          child.expect(
                              pexpect.EOF,
                              timeout=remaining
                          )

                      except pexpect.TIMEOUT:

                          log(
                              "Workflow lifetime reached."
                          )

                          try:
                              child.terminate(
                                  force=True
                              )
                          except Exception:
                              pass

                      except Exception as error:

                          log(
                              f"Tunnel ended: {error}"
                          )

                  return True

              except Exception as error:

                  log(
                      f"Runflare tunnel error: {error}"
                  )

                  return False

              finally:

                  try:

                      if child and child.isalive():
                          child.terminate(
                              force=True
                          )

                  except Exception:
                      pass

                  try:

                      if logfile:
                          logfile.close()

                  except Exception:
                      pass


          # ==================================================
          # MAIN LOOP
          # ==================================================

          log(
              "=== Runflare tunnel service started ==="
          )

          while time.time() < END:

              success = run_tunnel()

              if time.time() >= END:
                  break

              if success:

                  log(
                      "Runflare tunnel disconnected."
                  )

              else:

                  log(
                      "Runflare tunnel failed."
                  )

              log(
                  "Restarting Runflare tunnel..."
              )

              # No intentional long delay.
              time.sleep(1)


          log(
              "=== Runflare tunnel service ended ==="
          )

          PY

          chmod +x tunnel.py

      # ==================================================
      # RUN RUNFLARE TUNNEL
      # ==================================================

      - name: Run Runflare tunnel
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python3 tunnel.py

      # ==================================================
      # FINAL PUSH
      # ==================================================

      - name: Final push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A

          git diff --cached --quiet || \
            git commit \
              -m "chore: final sync [skip ci]"

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:main || true

      # ==================================================
      # RETRIGGER
      # ==================================================

      - name: Retrigger
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ssh.yml",
                ref: context.ref
              });
            } catch (e) {
              console.log(e.message);
            }
