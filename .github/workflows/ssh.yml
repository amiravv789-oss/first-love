name: SSH Tunnel Auto Restart + Full Sync

on:
  workflow_dispatch:

concurrency:
  group: ssh-host-runner
  cancel-in-progress: false

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          lfs: true

      - name: Setup SSH Server + tools + Git LFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client git-lfs
          git lfs install

          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          echo "root:tunnelpass" | sudo chpasswd
          sudo service ssh restart
          echo "SSH ready on port 22"

      - name: Load previous state
        run: |
          mkdir -p state
          if [ -f state/ssh-history.log ]; then
            echo "=== Last history ==="
            tail -n 20 state/ssh-history.log
          fi
          if [ -f state/last-link.txt ]; then
            echo "Last link: $(cat state/last-link.txt)"
          fi

      - name: Run tunnels until workflow end
        run: |
          set -e
          echo "=== Start $(date) ===" >> state/ssh-history.log
          END_TIME=$(( $(date +%s) + 340 * 60 ))

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "[$(date)] Starting new tunnel..." | tee -a state/ssh-history.log

            timeout 55m ssh -p 443 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -R0:localhost:22 \
              qr@free.pinggy.io > tunnel-out.log 2>&1 &

            SSH_PID=$!
            sleep 15

            LINK=$(grep -oE 'tcp://[a-zA-Z0-9.-]+\.[a-zA-Z0-9.-]+:[0-9]+' tunnel-out.log | head -1 || true)

            if [ -n "$LINK" ]; then
              echo "$LINK" > state/last-link.txt
              echo "[$(date)] Link: $LINK" | tee -a state/ssh-history.log

              # HTML page
              cat > state/index.html << EOF
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<title>Current SSH Link</title>
<style>
body{font-family:sans-serif;text-align:center;padding:40px;background:#111;color:#0f0}
.link{font-size:1.6rem;word-break:break-all;background:#222;padding:20px;border-radius:8px;margin:20px}
.time{color:#888;margin-top:20px}
</style>
</head>
<body>
<h1>Current SSH Tunnel</h1>
<div class="link">$LINK</div>
<div class="time">Updated: $(date -u)</div>
<p>Auto refresh every 30s</p>
</body>
</html>
EOF
            else
              echo "[$(date)] No link found yet" | tee -a state/ssh-history.log
              cat tunnel-out.log >> state/ssh-history.log || true
            fi

            wait $SSH_PID || true
            echo "[$(date)] Tunnel ended. Restart in 5s..." | tee -a state/ssh-history.log
            sleep 5
          done

          echo "=== End $(date) ===" >> state/ssh-history.log

      - name: Full save (all files + LFS)
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git lfs track "*.zip" "*.rar" "*.tar.gz" "*.7z" "*.db" "*.sqlite" "*.mp4" "*.mkv" "*.bin" "*.dat" || true
          git add .gitattributes || true

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: full sync + SSH link [skip ci]"
            git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            echo "All files pushed"
          fi

      - name: Trigger next run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: context.workflow,
                ref: context.ref
              });
              console.log("Next triggered");
            } catch (e) {
              console.log("Trigger failed:", e.message);
            }
