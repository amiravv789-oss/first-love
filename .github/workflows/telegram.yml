name: Telegram Bot (Private Code Runner)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/330 * * * *'

concurrency:
  group: telegram-runner
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Runner Repo (For history.json)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Clone Private Code Repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/amiravv789-oss/telegram.git bot-code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rar


      - name: Run Main
        run: |
          cd bot-code
          timeout 320m python main.py || true


      - name: Trigger Next Workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'telegram.yml',
                ref: context.ref
              });
            } catch (error) {
              console.log("Error triggering next workflow: ", error);
            }
