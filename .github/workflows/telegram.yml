name: Telegram Bot (Private Code Runner)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/330 * * * *'

concurrency:
  group: telegram-runner
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Runner Repo (For database.json)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Clone Private Code Repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/amiravv789-oss/telegram.git bot-code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rar

      - name: Load existing database.json
        run: |
          if [ -f database.json ]; then
            cp database.json bot-code/database.json
            echo "Loaded existing database.json from runner repo."
          else
            echo "No database.json found in runner repo, starting fresh."
          fi

      - name: Run Main
        run: |
          cd bot-code
          timeout 320m python main.py || true

      - name: Extract and commit updated history back to runner repo
        if: always()
        run: |
          if [ -f bot-code/database.json ]; then
            cp bot-code/database.json ./database.json
            git config --global user.name "GitHub Actions Bot"
            git config --global user.email "actions@github.com"
            git add database.json
            git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update bot history.json [skip ci]"
            git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            echo "History sync process finished."
          else
            echo "database.json not generated by bot."
          fi

      - name: Trigger Next Workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'telegram.yml',
                ref: context.ref
              });
            } catch (error) {
              console.log("Error triggering next workflow: ", error);
            }
