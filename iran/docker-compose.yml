services:
  tunnel-server:
    build: .
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8787"
      PUBLIC_PORTS: "443,8443,1080,8081"
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN to 32 or more characters}"
      TLS_DIR: "/data"
    volumes:
      - tunnel-tls:/data
    ports:
      - "8787:8787/tcp"
      - "443:443/tcp"
      - "8443:8443/tcp"
      - "1080:1080/tcp"
      - "8081:8081/tcp"
volumes:
  tunnel-tls:
